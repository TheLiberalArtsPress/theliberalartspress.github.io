<!-- LAPEN_TOPIC_ENHANCED_V1 -->
<script>
(function(){
  var grid=document.querySelector('main.grid');
  if(!grid)return;
  var cards=Array.prototype.slice.call(grid.querySelectorAll('.b-card'));
  cards.forEach(function(card,idx){
    card.dataset.origIdx=String(idx);
    var href=card.getAttribute('href')||'';
    var m=href.match(/\/([^\/]+)\.html$/);
    var bid=m?m[1]:'';
    var titleEl=card.querySelector('.b-title');
    var metaEl=card.querySelector('.b-meta');
    var priceEl=card.querySelector('.b-price');
    var imgEl=card.querySelector('.b-thumb img');
    var title=titleEl?titleEl.textContent.trim():'';
    var meta=metaEl?metaEl.textContent.trim():'';
    var pMatch=priceEl?priceEl.textContent.match(/\d+/):null;
    var price=pMatch?Number(pMatch[0]):0;
    card.dataset.bid=bid;
    card.dataset.price=String(price);
    card.dataset.search=(title+' '+meta).toLowerCase();
    if(bid){
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='b-wish';
      btn.title='加入我的收藏／待購書單';
      btn.textContent='♡';
      btn.addEventListener('click',function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var list=[];
        try{list=JSON.parse(localStorage.getItem('lapen_wishlist')||'[]');}catch(e){}
        var i=list.findIndex(function(x){return String(x.id)===String(bid);});
        if(i>=0){list.splice(i,1);}else{
          var cover=imgEl?(imgEl.getAttribute('src')||'').replace(/^\.\.\//,''):('assets/covers/'+bid+'.webp');
          list.unshift({id:bid,title:title,author:meta,category:'',price:price,cover:cover,savedAt:Date.now()});
        }
        try{localStorage.setItem('lapen_wishlist',JSON.stringify(list));}catch(e){}
        syncWishes();
      });
      card.appendChild(btn);
    }
  });
  function syncWishes(){
    var list=[];
    try{list=JSON.parse(localStorage.getItem('lapen_wishlist')||'[]');}catch(e){}
    var set={};
    list.forEach(function(x){set[String(x.id)]=true;});
    cards.forEach(function(c){
      var b=c.querySelector('.b-wish');
      if(!b)return;
      var saved=!!set[String(c.dataset.bid)];
      b.classList.toggle('saved',saved);
      b.textContent=saved?'♥':'♡';
      b.title=saved?'已收藏（點擊移除）':'加入我的收藏／待購書單';
    });
  }
  var filterInput=document.getElementById('topicFilter');
  var sortSel=document.getElementById('topicSort');
  var countEl=document.getElementById('topicCount');
  function applyFilterAndSort(){
    var q=(filterInput?filterInput.value:'').trim().toLowerCase();
    var mode=sortSel?sortSel.value:'default';
    var sorted=cards.slice().sort(function(a,b){
      if(mode==='price-asc')return Number(a.dataset.price)-Number(b.dataset.price);
      if(mode==='price-desc')return Number(b.dataset.price)-Number(a.dataset.price);
      return Number(a.dataset.origIdx)-Number(b.dataset.origIdx);
    });
    var visible=0;
    sorted.forEach(function(c){
      var show=!q||c.dataset.search.indexOf(q)!==-1;
      c.style.display=show?'':'none';
      if(show)visible++;
      grid.appendChild(c);
    });
    if(countEl)countEl.textContent='顯示 '+visible+' / '+cards.length+' 冊';
  }
  if(filterInput)filterInput.addEventListener('input',applyFilterAndSort);
  if(sortSel)sortSel.addEventListener('change',applyFilterAndSort);
  syncWishes();
  applyFilterAndSort();
})();
</script>
