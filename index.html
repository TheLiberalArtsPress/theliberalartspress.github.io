    if (str.length === 3) return str[0] + "○" + str[2];
    return str[0] + "○".repeat(str.length - 2) + str[str.length - 1];

// 🟢 【效能優化】：支援動態圖片尺寸 (卡片預設 400px 節省頻寬，Modal 詳細頁載入 1000px 高清圖)
const formatImageUrl = (url, width = 400) => {
    if (!url) return SVG_COVER_FALLBACK;
    let strUrl = String(url).trim();
    if (!strUrl) return SVG_COVER_FALLBACK;
    if (strUrl.startsWith('data:image') || strUrl.startsWith('assets/')) return strUrl;
    
    let driveId = null;
    if (strUrl.includes('drive.google.com')) {
        const match = strUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || strUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match) driveId = match[1];
    } else if (/^[a-zA-Z0-9_-]{20,}$/.test(strUrl) && !strUrl.includes("/")) {
        driveId = strUrl;
    }
    if (driveId) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w${width}`;
    return strUrl;
};

const getBookIntro = (book) => {
    if (!book) return '';
    for (const key of Object.keys(book)) {
        const k = key.trim().toLowerCase();
        if (k.includes('intro') || k.includes('list') || k.includes('description') || k.includes('簡介') || k.includes('介紹') || k === 'n' || k === '13') {
            const val = String(book[key] || '').trim();
            if (val) return val;
        }
    }
    return String(book.intro || book['書籍介紹'] || '').trim();
};

const getBookReview = (book) => {
    if (!book) return '';
    for (const key of Object.keys(book)) {
        const k = key.trim().toLowerCase();
        if (k.includes('心得') || k.includes('review') || k.includes('評析') || k === 'o' || k === '14') {
            const val = String(book[key] || '').trim();
            if (val) return val;
        }
    }
    if (book.title && book.title.includes('塔裡的女人')) {
        return `《塔裡的女人》是一部充滿浪漫與悲劇色彩的愛情小說。閱讀過程中，最令人印象深刻的，不只是男女主角的愛情故事，而是作者對人性、命運與人生選擇的深刻描寫。`;

    return '';
};

function App() {
    const staticData = (typeof window !== "undefined" && window.STATIC_DATA) || {};
    const [ui, setUi] = useState(() => (staticData.ui && Object.keys(staticData.ui).length > 0) ? staticData.ui : defaultUI);
    const [settings, setSettings] = useState(() => (staticData.settings && Object.keys(staticData.settings).length > 0) ? staticData.settings : { systemName: '文史哲出版社', systemSubName: 'The Liberal Arts Press' });
    const [carousels, setCarousels] = useState(() => {
        if (staticData.carousels && staticData.carousels.length > 0) return staticData.carousels;
        const cached = safeGetStorage('lapen_carousels_v4');
        if (cached) { try { const p = JSON.parse(cached); if(p.length > 0) return p; } catch(e) {} }
        return fallbackCarousels;
    });
    const [carouselIndex, setCarouselIndex] = useState(0); 
    const [books, setBooks] = useState(() => {
        if (staticData.books && staticData.books.length > 0) return staticData.books;
        const cached = safeGetStorage('lapen_books_v6');
        if (cached) { try { const p = JSON.parse(cached); if(p.length > 0) return p.sort(() => 0.5 - Math.random()); } catch(e) {} }
        return fallbackBooks;
    });
    const [choiceBooks, setChoiceBooks] = useState(() => (staticData.choices && staticData.choices.length > 0) ? staticData.choices : []);
    const [cart, setCart] = useState([]);
    const [isCartOpen, setIsCartOpen] = useState(false);
    const [isContactOpen, setIsContactOpen] = useState(false);
    const [notification, setNotification] = useState(null);
    const [isRecommendationHovered, setIsRecommendationHovered] = useState(false);
    
    const [isCartDetailsOpen, setIsCartDetailsOpen] = useState(true);
    const [selectedPayment, setSelectedPayment] = useState('店取付現金');

    const [isBooksLoading, setIsBooksLoading] = useState(() => !(staticData.books && staticData.books.length > 0)); 
    const [isCheckingOut, setIsCheckingOut] = useState(false);
    const [isSubmittingCS, setIsSubmittingCS] = useState(false);
    const [lastActionTime, setLastActionTime] = useState(0);

    const [selectedCategory, setSelectedCategory] = useState('全部');
    const [visibleCount, setVisibleCount] = useState(8); 
    
    const [iframeModal, setIframeModal] = useState({ isOpen: false, url: '', title: '' });
    const [isAboutOpen, setIsAboutOpen] = useState(false);
    const [isSearchModalOpen, setIsSearchModalOpen] = useState(false);
    const [isRandomBooksOpen, setIsRandomBooksOpen] = useState(false);

    const [searchForm, setSearchForm] = useState({ code: '', title: '', author: '', year: '', category: '' });
    const [appliedSearch, setAppliedSearch] = useState({ code: '', title: '', author: '', year: '', category: '' });
    const [searchVisibleCount, setSearchVisibleCount] = useState(8);

    const [randomBooks, setRandomBooks] = useState([]);
    const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
    const [showBackToTop, setShowBackToTop] = useState(false);
    const [isAllCategoriesExpanded, setIsAllCategoriesExpanded] = useState(false);

    const [submittedDetail, setSubmittedDetail] = useState(null);
    const [isOrderQueryOpen, setIsOrderQueryOpen] = useState(false);
    const [orderQueryInput, setOrderQueryInput] = useState('');
    const [queryResults, setQueryResults] = useState([]);
    const [isQueryingGAS, setIsQueryingGAS] = useState(false);
    const [hasQueried, setHasQueried] = useState(false);

    const [selectedBookDetail, setSelectedBookDetail] = useState(null);
    const [isBookDetailFullscreen, setIsBookDetailFullscreen] = useState(false);
    const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
    const [reviewBook, setReviewBook] = useState(null);
    const [isSubmittingReview, setIsSubmittingReview] = useState(false);

    const [isAiModalOpen, setIsAiModalOpen] = useState(false);
    const [aiSelectedBookId, setAiSelectedBookId] = useState('');
    const [aiAnalysisResult, setAiAnalysisResult] = useState('');
    const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
    const [aiCustomQuestion, setAiCustomQuestion] = useState('');
    const [logoClickCount, setLogoClickCount] = useState(0);

    const sliderRef = useRef(null);
    const hasFetchedRef = useRef(false);

    const showMsg = useCallback((text) => {
        setNotification(text);
        setTimeout(() => setNotification(null), 3000);
    }, []);

    const checkRateLimit = useCallback(() => {
        const now = Date.now();
        if (now - lastActionTime < 15000) {
            const secondsLeft = Math.ceil((15000 - (now - lastActionTime)) / 1000);
            showMsg(`操作過於頻繁，請等待 ${secondsLeft} 秒後再試！`);
            return false;
        }
        return true;
    }, [lastActionTime, showMsg]);

    useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    const syncWithGAS = useCallback(async (action, payloadData = null) => {
        try {
            const currentOrigin = window.location.origin;
            const safeOrigin = currentOrigin.includes("usercontent.goog") 
                ? "https://candylovema.github.io" 
                : currentOrigin;

            const payloadObj = { action, payload: payloadData, origin: safeOrigin };
            const response = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payloadObj),
                keepalive: true
            });
            return await response.json();
        } catch (e) {
            return { status: 'error', msg: e.toString() };
        }
    }, []);

    // 🟢 【極致效能重構】：改用單一 FETCH_INIT_DATA 合流 API 請求，一次性拿回所有初始資料！
    useEffect(() => {
        if (hasFetchedRef.current) return;
        hasFetchedRef.current = true;

        syncWithGAS('FETCH_INIT_DATA').then(res => {
            if (res && res.status === 'success' && res.data) {
                const { settings: fetchedSettings, ui: fetchedUi, carousels: fetchedCarousels, choices: fetchedChoices, books: fetchedBooks } = res.data;

                if (fetchedSettings && Object.keys(fetchedSettings).length > 0) {
                    setSettings(prev => ({ ...prev, ...fetchedSettings }));
                    if (fetchedSettings.systemName) document.title = `${fetchedSettings.systemName} 有限公司｜台灣人文學術出版社（首頁）官網`;
                }
                if (fetchedUi && Object.keys(fetchedUi).length > 0) {
                    setUi(prev => ({ ...prev, ...fetchedUi }));
                    if (fetchedUi.frontendName) document.title = `${fetchedUi.frontendName} - 首頁`;
                }
                if (Array.isArray(fetchedCarousels) && fetchedCarousels.length > 0) {
                    const published = fetchedCarousels.filter(c => c.status === '已發佈');
                    if (published.length > 0) {
                        setCarousels(published);
                        safeSetStorage('lapen_carousels_v4', JSON.stringify(published));
                    }
                }
                if (Array.isArray(fetchedChoices)) {
                    const valid = fetchedChoices.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                    setChoiceBooks(valid);
                }
                if (Array.isArray(fetchedBooks)) {
                    const valid = fetchedBooks.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                    const shuffled = valid.sort(() => 0.5 - Math.random());
                    setBooks(shuffled);
                    safeSetStorage('lapen_books_v6', JSON.stringify(shuffled.slice(0, 150)));
                }
            } else {
                // 🛡️ 後備相容機制：若舊版後端尚未更新，自動降級為傳統分發 Request
                Promise.allSettled([
                    syncWithGAS('FETCH_SETTINGS'),
                    syncWithGAS('FETCH_UI'),
                    syncWithGAS('FETCH_CAROUSELS'),
                    syncWithGAS('FETCH_CHOICES'),
                    syncWithGAS('FETCH_BOOKS')
                ]).then(([resSettings, resUi, resCarousels, resChoices, resBooks]) => {
                    if (resSettings.status === 'fulfilled' && resSettings.value?.data) {
                        setSettings(prev => ({ ...prev, ...resSettings.value.data }));
                    }
                    if (resUi.status === 'fulfilled' && resUi.value?.data) {
                        setUi(prev => ({ ...prev, ...resUi.value.data }));
                    }
                    if (resCarousels.status === 'fulfilled' && Array.isArray(resCarousels.value?.data)) {
                        const published = resCarousels.value.data.filter(c => c.status === '已發佈');
                        if (published.length > 0) setCarousels(published);
                    }
                    if (resChoices.status === 'fulfilled' && Array.isArray(resChoices.value?.data)) {
                        setChoiceBooks(resChoices.value.data.filter(b => b.title && b.title !== '未命名書籍'));
                    }
                    if (resBooks.status === 'fulfilled' && Array.isArray(resBooks.value?.data)) {
                        const valid = resBooks.value.data.filter(b => b.title && b.title !== '未命名書籍');
                        setBooks(valid.sort(() => 0.5 - Math.random()));
                    }
                });
            }
        }).finally(() => setIsBooksLoading(false));
    }, [syncWithGAS]);

    const handleOrderQuerySubmit = async (e) => {
        e.preventDefault();
        const term = orderQueryInput.trim().toLowerCase();
        if (term.length < 2) return showMsg("請輸入至少 2 個字以供精確比對");
        
        setIsQueryingGAS(true);
        setHasQueried(true);
        setQueryResults([]);
        try {
            const res = await syncWithGAS('FETCH_ORDERS');
            if (res && res.status === 'success' && Array.isArray(res.data)) {
                const filtered = res.data.filter(ord => {
                    const oId = String(ord.id || ord['訂單編號'] || '').toLowerCase();
                    const oCust = String(ord.customer || ord['客戶姓名'] || '').toLowerCase();
                    const oPhone = String(ord.phone || ord['電話'] || '').toLowerCase();
                    return oId.includes(term) || oCust.includes(term) || oPhone.includes(term);
                });
                setQueryResults(filtered);
            } else showMsg(res?.msg || "未能取得訂單記錄");
        } catch (error) {
            showMsg("查詢出錯，請稍候重試");
        } finally {
            setIsQueryingGAS(false);
        }
    };

    useEffect(() => {
        if (carousels.length <= 1) return;
        const timer = setInterval(() => setCarouselIndex((prev) => (prev + 1) % carousels.length), 5000); 
        return () => clearInterval(timer);
    }, [carousels.length]);

    const dynamicCategories = useMemo(() => {
        const priorityCats = ['文史哲學集成', '文史哲學術叢刊', '文學叢刊', '文史哲詩叢'];
        const existingCats = [...new Set(books.map(b => b.category).filter(c => c && c.trim() !== ""))];
        const presentPriority = priorityCats.filter(cat => existingCats.includes(cat));
        const remainingPriority = priorityCats.filter(cat => !existingCats.includes(cat));
        const orderedPriority = [...presentPriority, ...remainingPriority];
        const otherCats = existingCats.filter(c => !priorityCats.includes(c) && c !== '全部');
        return ['全部', ...orderedPriority, ...otherCats];
    }, [books]);

    const visibleCategories = useMemo(() => {
        if (isAllCategoriesExpanded) return dynamicCategories;
        return dynamicCategories.slice(0, 5);
    }, [dynamicCategories, isAllCategoriesExpanded]);

    const excelCategories = useMemo(() => {
        const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
        return [...new Set(cats)].sort();
    }, [books]);

    const filteredBooks = useMemo(() => {
        if (selectedCategory === '全部') return books;
        return books.filter(b => b.category === selectedCategory);
    }, [books, selectedCategory]);

    const visibleBooks = useMemo(() => filteredBooks.slice(0, visibleCount), [filteredBooks, visibleCount]);
    const displayChoiceBooks = useMemo(() => choiceBooks.length > 0 ? choiceBooks : books.slice(0, 10), [choiceBooks, books]);

    const analyzeBookWithGemini = async (targetBook, customQ = "") => {
        if (!targetBook) return;
        setIsAiAnalyzing(true);
        setAiAnalysisResult("");
        
        try {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const systemPrompt = `你是一位享譽華文出版界的權威國學專家與「文史哲出版社」資深學術總編輯。你的任務是針對華文書籍進行極具深度、嚴謹、精闢且優美的學術解析與導讀。請以典雅流暢的繁體中文回答。`;

            let userPrompt = `請為以下書籍進行深度學術解析與閱讀導引：\n`;
            userPrompt += `■ 書名：${targetBook.title}\n`;
            userPrompt += `■ 作者：${targetBook.author || '未標明'}\n`;
            userPrompt += `■ 出版年份：${targetBook.year || '未標明'}\n`;
            userPrompt += `■ 叢書類別：${targetBook.category || '通用'}\n`;
            userPrompt += `■ 書籍編號：${targetBook.id || '無'}\n`;
            
            const bookIntroText = getBookIntro(targetBook);
            if (bookIntroText) userPrompt += `■ 既有書籍介紹與綱要：${bookIntroText}\n`;
            const bookReviewThought = getBookReview(targetBook);
            if (bookReviewThought) userPrompt += `■ 編輯部特色心得評析：${bookReviewThought}\n`;

            if (customQ.trim()) {
                userPrompt += `\n【讀者特別提問】：${customQ.trim()}\n請針對上述問題進行深入解答。`;
            } else {
                userPrompt += `\n請包含以下四大解讀維度：\n`;
                userPrompt += `1. 📜【時代背景與學術脈絡】（分析本書在該領域的歷史定位與學術價值）\n`;
                userPrompt += `2. 💡【三大核心旨趣與研讀亮點】（列出最值得細細品味的3個重點）\n`;
                userPrompt += `3. 🎯【適合閱讀對象與深度思考題】（提供給研究者或一般讀者的進階思考方向）\n`;
                userPrompt += `4. ✒️【主編精闢一句話導讀】（用一句深具文化底蘊的話總結本書靈魂）`;
            }

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                })
            });

            const result = await response.json();
            const generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                                    <div className="border-t border-dashed pt-2 flex justify-between items-baseline">
                                        <span className="font-bold text-sm">付款總額</span>
                                        <span className="text-xl font-black text-[var(--primary-color)]">NT$ {submittedDetail.data.total.toLocaleString()}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 text-center text-blue-800 font-bold">
                                        已成功登記客服編號：{submittedDetail.data.id}
                                    </div>
                                    <div><span className="text-gray-400">反映人：</span>{submittedDetail.data.name}</div>
                                    <div><span className="text-gray-400">內容：</span><p className="p-2 bg-gray-50 rounded mt-1 whitespace-pre-wrap">{submittedDetail.data.message}</p></div>
                                </div>
                            )}
                        </div>
                        <div className="receipt-edge-zigzag h-[10px] w-full bg-white relative -top-0.5"></div>
                        <div className="bg-gray-50 p-3 flex gap-2 justify-center">
                            <button type="button" onClick={() => window.print()} className="bg-white border px-4 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1"><Icon name="Printer" size={14}/> 列印憑證</button>
                            <button type="button" onClick={() => setSubmittedDetail(null)} className="bg-[var(--dark-color)] text-white px-5 py-1.5 rounded-lg font-bold text-xs"><Icon name="Check" size={14}/> 關閉</button>
                        </div>
                    </div>
                </div>
            )}

            {isOrderQueryOpen && (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[200] flex justify-center items-center p-4 md:p-8 overflow-y-auto">
                    <div className="glass-modal w-full max-w-3xl max-h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in" onClick={(e)=>e.stopPropagation()}>
                        <div className="p-4 border-b border-[var(--border-color)] flex justify-between items-center bg-white/80">
                            <h2 className="text-base md:text-lg font-black flex items-center gap-2 text-[var(--dark-color)] font-serif"><Icon name="FileText" size={20} className="text-[var(--primary-color)]" /> 最近訂單查詢</h2>
                            <button type="button" onClick={() => { setIsOrderQueryOpen(false); setOrderQueryInput(''); setQueryResults([]); setHasQueried(false); }} className="bg-white border px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><Icon name="X" size={14} /> 關閉</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-5 md:p-6 font-sans">
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 mb-5 flex items-start gap-2">
                                <Icon name="Info" size={16} className="text-[var(--primary-color)] mt-0.5 shrink-0" />
                                <span><strong>隱私保護：</strong>查詢僅即時比對您輸入的<strong>客戶姓名、手機號碼或訂單編號</strong>，絕不向前台洩漏完整訂單名單。</span>
                            </div>
                            <form onSubmit={handleOrderQuerySubmit} className="flex gap-2.5 mb-6">
                                <input 
                                    type="text" 
                                    value={orderQueryInput} 
                                    onChange={(e) => setOrderQueryInput(e.target.value)}
                                    placeholder="輸入姓名、手機號碼 或 ORD- 單號" 
                                    required
                                    className="flex-1 glass-input p-2.5 rounded-xl text-xs font-bold outline-none"
                                />
                                <button type="submit" disabled={isQueryingGAS} className="bg-[var(--primary-color)] hover:bg-[var(--dark-color)] text-white px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-1.5 text-xs shrink-0 active:scale-95 disabled:opacity-50">
                                    {isQueryingGAS ? <Icon name="RefreshCw" size={14} className="animate-spin"/> : <Icon name="Search" size={14}/>}
                                    {isQueryingGAS ? '檢索中...' : '立即檢索'}
                                </button>
                            </form>
                            <div className="min-h-[140px]">
                                {isQueryingGAS ? (
                                    <div className="py-12 flex flex-col items-center justify-center gap-2 text-[var(--primary-color)]">
                                        <Icon name="RefreshCw" size={28} className="animate-spin"/>
                                        <span className="text-xs font-bold">即時連線雲端資料庫中...</span>
                                    </div>
                                ) : hasQueried ? (
                                    queryResults.length === 0 ? (
                                        <div className="py-10 text-center text-gray-500 text-xs font-bold">找不到與「{orderQueryInput}」相符的訂單，請確認輸入無誤。</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {queryResults.map((ord, idx) => (
                                                <div key={idx} className="glass-card p-4 rounded-xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-3 text-xs">
                                                    <div className="space-y-1">
                                                        <div className="flex items-center gap-2">
                                                            <span className="bg-[var(--dark-color)] text-white font-mono px-2 py-0.5 rounded text-[11px]">{ord.id || ord['訂單編號']}</span>
                                                            <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold text-[11px]">{ord.status || ord['狀態'] || '處理中'}</span>
                                                        </div>
                                                        <p className="text-gray-600">客戶：<strong>{maskName(ord.customer || ord['客戶姓名'])}</strong> ・ 電話：<strong>{maskPhone(ord.phone || ord['電話'])}</strong></p>
                                                        <p className="text-gray-500 text-[11px]">下單時間：{ord.date || ord['日期']}</p>
                                                    </div>
                                                    <div className="text-right font-black text-base text-[var(--primary-color)]">
                                                        NT$ {parseInt(ord.total || ord['總金額'] || 0).toLocaleString()}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )
                                ) : (
                                    <div className="py-10 text-center text-gray-400 text-xs font-bold">請於上方輸入搜尋條件進行精確檢索。</div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {selectedBookDetail && (
                <div className={`fixed inset-0 bg-black/65 backdrop-blur-md z-[220] flex justify-center items-center ${isBookDetailFullscreen ? 'p-0' : 'p-4 md:p-8'} overflow-y-auto animate-in`} onClick={() => setSelectedBookDetail(null)}>
                    <div className={`glass-modal w-full ${isBookDetailFullscreen ? 'h-full max-w-none max-h-none rounded-none border-0' : 'max-w-2xl rounded-3xl border border-white/80'} shadow-2xl flex flex-col overflow-hidden transition-all duration-300`} onClick={(e) => e.stopPropagation()}>
                        <div className="p-4 border-b border-[var(--border-color)] flex justify-between items-center bg-white/80">
                            <h2 className="text-base md:text-lg font-serif font-black text-[var(--dark-color)] flex items-center gap-2"><Icon name="BookOpen" size={20} className="text-[var(--primary-color)]" /> 圖書詳細資訊</h2>
                            <div className="flex items-center gap-2">
                                <button 
                                    type="button" 
                                    onClick={() => setIsBookDetailFullscreen(!isBookDetailFullscreen)} 
                                    className="px-3 py-1 rounded-full bg-[var(--bg-light)] hover:bg-[var(--primary-color)] hover:text-white text-[var(--dark-color)] text-xs font-bold transition flex items-center gap-1.5 border border-[var(--border-color)] shadow-sm"
                                    title={isBookDetailFullscreen ? "縮小視窗" : "全螢幕放大"}
                                >
                                    <Icon name={isBookDetailFullscreen ? "Minimize" : "Maximize"} size={14} />
                                    <span>{isBookDetailFullscreen ? "縮小" : "全螢幕放大"}</span>
                                </button>
                                <button type="button" onClick={() => { setSelectedBookDetail(null); setIsBookDetailFullscreen(false); }} className="p-1 rounded-full text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition"><Icon name="X" size={18} /></button>
                            </div>
                        </div>
                        <div className={`p-5 md:p-8 font-sans overflow-y-auto flex-1 space-y-5 ${isBookDetailFullscreen ? 'max-w-5xl mx-auto w-full' : ''}`}>
                            <div className="flex flex-col sm:flex-row gap-6 items-start">
                                <div className={`w-full ${isBookDetailFullscreen ? 'sm:w-60 h-80' : 'sm:w-44 h-56'} shrink-0 bg-[var(--bg-light)] rounded-xl overflow-hidden p-2 border flex justify-center items-center transition-all`}>
                                    <img src={formatImageUrl(selectedBookDetail.cover, 1000)} alt={selectedBookDetail.title} className="h-full w-auto object-contain rounded book-spine-shadow" onError={(e) => handleImgError(e, SVG_COVER_FALLBACK)} />
                                </div>
                                <div className="flex-1 space-y-3 text-left">
                                    <h3 className={`${isBookDetailFullscreen ? 'text-2xl md:text-3xl' : 'text-xl'} font-black text-[var(--dark-color)] font-serif`}>{selectedBookDetail.title}</h3>
                                    <div className={`grid grid-cols-2 gap-y-2 gap-x-3 ${isBookDetailFullscreen ? 'text-sm md:text-base' : 'text-xs'} text-[var(--text-dark)] border-y py-3`}>
                                        <div>作者：<strong>{selectedBookDetail.author || '未標記'}</strong></div>
                                        <div>年份：<strong>{selectedBookDetail.year || '未標記'}</strong></div>
                                        <div>分類：<strong className="text-[var(--primary-color)]">{selectedBookDetail.category || '未分類'}</strong></div>
                                        <div>書碼：<strong className="font-mono">{selectedBookDetail.id || '無'}</strong></div>
                                        <div className="col-span-2">定價：<strong className={`${isBookDetailFullscreen ? 'text-xl' : 'text-base'} font-black text-[var(--primary-color)]`}>NT$ {selectedBookDetail.price}</strong></div>
                                    </div>
                                    <div>
                                        <h4 className={`${isBookDetailFullscreen ? 'text-sm md:text-base' : 'text-xs'} font-bold text-[var(--dark-color)] mb-1 flex items-center gap-1`}><Icon name="FileText" size={16} className="text-[var(--primary-color)]" /> 書籍簡介：</h4>
                                        <div className={`bg-white/80 border p-3 rounded-xl ${isBookDetailFullscreen ? 'text-sm md:text-base leading-relaxed max-h-60' : 'text-xs leading-relaxed max-h-36'} overflow-y-auto whitespace-pre-wrap text-gray-700`}>
                                            {getBookIntro(selectedBookDetail) || '暫無內容介紹。'}
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className={`${isBookDetailFullscreen ? 'text-sm md:text-base' : 'text-xs'} font-bold text-purple-900 mb-1 flex items-center gap-1`}><Icon name="Sparkles" size={16} className="text-purple-600" /> 讀後心得與學術評析：</h4>
                                        <div className={`bg-purple-50/90 border border-purple-200 p-3 rounded-xl ${isBookDetailFullscreen ? 'text-sm md:text-base leading-relaxed max-h-60' : 'text-xs leading-relaxed max-h-36'} overflow-y-auto text-purple-950 italic`}>
                                            {getBookReview(selectedBookDetail) || '目前 Book_ALL 試算表中此書籍尚無填寫「心得」內容。'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-3 pt-3">
                                <button type="button" onClick={() => { const b = selectedBookDetail; setSelectedBookDetail(null); setIsBookDetailFullscreen(false); openReviewModalForBook(b); }} className={`flex-1 bg-gradient-to-r from-purple-500 to-indigo-600 text-white py-3 px-4 rounded-xl font-bold flex justify-center items-center gap-1.5 ${isBookDetailFullscreen ? 'text-sm md:text-base' : 'text-xs'} shadow active:scale-95`}>
                                    <Icon name="MessageCircle" size={18} /> 讀後心得交流
                                </button>
                                <button type="button" onClick={() => addToCart(selectedBookDetail)} disabled={selectedBookDetail.stock <= 0} className={`flex-1 bg-[var(--primary-color)] text-white py-3 px-4 rounded-xl font-bold flex justify-center items-center gap-1.5 ${isBookDetailFullscreen ? 'text-sm md:text-base' : 'text-xs'} shadow ${selectedBookDetail.stock <= 0 ? 'opacity-50 cursor-not-allowed' : 'active:scale-95'}`}>
                                    <Icon name="ShoppingCart" size={18} /> 加入書包
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {isReviewModalOpen && reviewBook && (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-[240] flex justify-center items-center p-4 md:p-8 overflow-y-auto animate-in" onClick={() => setIsReviewModalOpen(false)}>
                    <div className="glass-modal w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-white/80" onClick={(e) => e.stopPropagation()}>
                        <div className="p-4 border-b border-stone-200 flex justify-between items-center bg-stone-900 text-white">
                            <h2 className="text-base font-serif font-black text-amber-100 flex items-center gap-2"><Icon name="MessageCircle" size={18} className="text-purple-300" /> 讀後心得 — 《{reviewBook.title}》</h2>
                            <button type="button" onClick={() => setIsReviewModalOpen(false)} className="p-1 rounded-full text-stone-400 hover:text-white"><Icon name="X" size={16} /></button>
                        </div>
                        <div className="p-5 font-sans overflow-y-auto max-h-[75vh] space-y-4 text-xs">
                            <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-3.5 leading-relaxed">
                                <span className="font-bold text-[var(--dark-color)] block mb-1">精選心得（源自試算表）：</span>
                                <p className="text-gray-700">{getBookReview(reviewBook) || "目前尚無填寫心得，歡迎於下方發表您的感言！"}</p>
                            </div>
                            <form onSubmit={handleReviewSubmit} className="bg-white p-4 rounded-xl border space-y-3">
                                <h3 className="font-bold text-gray-800 flex items-center gap-1.5"><Icon name="Send" size={14} className="text-purple-500" /> 發表讀後感言：</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    <input name="name" required placeholder="您的稱呼" className="w-full glass-input p-2 rounded-lg outline-none" />
                                    <input name="contact" placeholder="聯絡電話或 Email (選填)" className="w-full glass-input p-2 rounded-lg outline-none" />
                                </div>
                                <textarea name="content" required rows="3" placeholder={`請輸入您對《${reviewBook.title}》的研讀心得或提問...`} className="w-full glass-input p-2.5 rounded-lg outline-none resize-none leading-relaxed" />
                                <button type="submit" disabled={isSubmittingReview} className={`w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl font-bold shadow transition flex justify-center items-center gap-1.5 text-xs ${isSubmittingReview ? 'opacity-50 cursor-not-allowed' : 'active:scale-95'}`}>
                                    {isSubmittingReview ? <Icon name="Clock" size={14} className="animate-spin" /> : <Icon name="Send" size={14} />}
                                    <span>{isSubmittingReview ? "傳送中..." : "送出心得反映"}</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            )}

            {isAiModalOpen && (
                <div className="fixed inset-0 bg-black/75 backdrop-blur-lg z-[260] flex justify-center items-center p-4 md:p-8 overflow-y-auto animate-in" onClick={() => setIsAiModalOpen(false)}>
                    <div className="glass-modal w-full max-w-3xl max-h-[88vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-indigo-400/40 bg-slate-950 text-white" onClick={(e) => e.stopPropagation()}>
                        <div className="p-4 border-b border-indigo-500/30 flex justify-between items-center bg-indigo-950/50">
                            <div className="flex items-center gap-2.5">
                                <Icon name="Brain" size={22} className="text-amber-300 animate-pulse" />
                                <div>
                                    <h2 className="text-base font-black font-serif text-amber-100 flex items-center gap-2">
                                        文史哲 AI 國學與學術分析儀
                                        <span className="text-[9px] font-sans font-bold bg-indigo-500/30 border border-indigo-400/30 text-indigo-200 px-2 py-0.5 rounded-full">Gemini 3 Flash</span>
                                    </h2>
                                </div>
                            </div>
                            <button type="button" onClick={() => setIsAiModalOpen(false)} className="p-1 rounded-full text-stone-400 hover:text-white"><Icon name="X" size={18} /></button>
                        </div>
                        <div className="p-5 font-sans overflow-y-auto flex-1 space-y-4 text-xs">
                            <div className="bg-slate-900 border border-slate-700 p-3.5 rounded-2xl space-y-2.5">
                                <select 
                                    value={aiSelectedBookId} 
                                    onChange={(e) => {
                                        const bId = e.target.value;
                                        setAiSelectedBookId(bId);
                                        const target = books.find(b => (b.id && b.id.toString() === bId) || b.title === bId);
                                        if (target) analyzeBookWithGemini(target, aiCustomQuestion);
                                    }}
                                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 font-bold text-amber-200 outline-none"
                                >
                                    {books.map((b, idx) => (
                                        <option key={idx} value={b.id || b.title}>[{b.category || '未分類'}] {b.title} ({b.author || '無作者'})</option>
                                    ))}
                                </select>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={aiCustomQuestion} 
                                        onChange={(e) => setAiCustomQuestion(e.target.value)} 
                                        placeholder="可輸入對本書的特別提問（例：本書在宋代理學之地位？）" 
                                        className="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-2 text-slate-200 outline-none"
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                const target = books.find(b => (b.id && b.id.toString() === aiSelectedBookId) || b.title === aiSelectedBookId) || books[0];
                                                analyzeBookWithGemini(target, aiCustomQuestion);
                                            }
                                        }}
                                    />
                                    <button 
                                        type="button" 
                                        disabled={isAiAnalyzing}
                                        onClick={() => {
                                            const target = books.find(b => (b.id && b.id.toString() === aiSelectedBookId) || b.title === aiSelectedBookId) || books[0];
                                            analyzeBookWithGemini(target, aiCustomQuestion);
                                        }}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-bold transition flex items-center gap-1 text-xs shrink-0 active:scale-95 disabled:opacity-50"
                                    >
                                        {isAiAnalyzing ? <Icon name="RefreshCw" size={13} className="animate-spin" /> : <Icon name="Sparkles" size={13} />}
                                        <span>{isAiAnalyzing ? "分析中..." : "重新分析"}</span>
                                    </button>
                                </div>
                            </div>
                            <div className="min-h-[200px] bg-slate-900 border border-indigo-500/20 rounded-2xl p-5 font-serif leading-relaxed text-slate-200 text-xs">
                                {isAiAnalyzing ? (
                                    <div className="py-16 flex flex-col justify-center items-center gap-2 text-indigo-300 font-sans">
                                        <Icon name="Cpu" size={32} className="animate-bounce text-amber-300" />
                                        <span className="font-bold">Gemini 3 Flash 正在精讀典籍並構建學術導讀...</span>
                                    </div>
                                ) : aiAnalysisResult ? (
                                    <div className="whitespace-pre-wrap space-y-3">{aiAnalysisResult}</div>
                                ) : (
                                    <div className="py-12 text-center text-slate-500 font-sans">請選擇書籍並點擊「重新分析」啟動 AI 學術解讀。</div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {notification && (
                <div className="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 glass-dark text-white px-5 py-3 rounded-2xl shadow-2xl animate-in font-bold text-xs md:text-sm z-[300] flex items-center gap-2 border-l-4 border-[var(--primary-color)] whitespace-nowrap">
                    <Icon name="CheckCircle" size={16} className="text-emerald-400" /> {notification}
                </div>
            )}
        </div> 
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
