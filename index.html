<!-- ⚡ 動態防快取載入核心數據與應用程序，保證任何更新瞬間同步 -->
<script>
    (function() {
        const timestamp = Date.now();
        function loadScript(src, isDefer) {
            const s = document.createElement('script');
            s.src = src + '?v=' + timestamp;
            if (isDefer) s.defer = true;
            document.body.appendChild(s);
        }
        loadScript('init_data.js', false);
        loadScript('data.js', true);
        loadScript('app.js', false);
    })();
</script>
