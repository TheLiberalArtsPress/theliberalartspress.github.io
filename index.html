    /* 📖 實體書立體書脊摺痕與光影 (Book Spine Shadow & Crease) */
    .book-spine-effect {
        position: relative;
        overflow: hidden;
        border-radius: 4px 10px 10px 4px;
        box-shadow: -2px 0 5px -1px rgba(0, 0, 0, 0.25),
                    5px 8px 22px -4px rgba(44, 36, 27, 0.22),
                    inset 3px 0 4px rgba(255, 255, 255, 0.3),
                    inset -1px 0 2px rgba(0, 0, 0, 0.15);
    }
    .book-spine-effect::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 14px;
        background: linear-gradient(to right, 
            rgba(0, 0, 0, 0.25) 0%, 
            rgba(255, 255, 255, 0.4) 22%, 
            rgba(0, 0, 0, 0.15) 45%, 
            rgba(0, 0, 0, 0.03) 75%, 
            transparent 100%);
        pointer-events: none;
        z-index: 10;
        border-right: 0.5px solid rgba(0, 0, 0, 0.08);
    }
    .book-spine-effect::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 55%);
        pointer-events: none;
        z-index: 9;
    }

    .ink-enter-jing { animation: inkFadeJing 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .ink-enter-shi { animation: inkFadeShi 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .ink-enter-zi { animation: inkFadeZi 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .ink-enter-ji { animation: inkFadeJi 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .ink-enter-default { animation: inkFadeJing 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* ✨ 典雅金屬流光微掃 (Button & Card Shimmer Sweep) */
    .shimmer-btn {
        position: relative;
        overflow: hidden;
    }
    .shimmer-btn::after {
        content: '';
        position: absolute;
        top: -60%;
        left: -80%;
        width: 50%;
        height: 220%;
        background: linear-gradient(
            to right,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.38) 50%,
            rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(30deg);
        pointer-events: none;
        transition: none;
    }
    .shimmer-btn:hover::after {
        left: 150%;
        transition: left 0.75s ease-in-out;
    }

    /* 📚 實體精裝書側邊多層紙張厚度光影 (Book Page Rim) */
    .book-page-rim {
        box-shadow: 
            -2px 0 5px -1px rgba(0, 0, 0, 0.22),
            5px 8px 22px -4px rgba(44, 36, 27, 0.22),
            inset 3px 0 4px rgba(255, 255, 255, 0.3),
            inset -2px 0 0 #D5C7B6,
            inset -4px 0 0 #F4EFEA,
            inset -5px 0 0 #D5C7B6;
    }

    .animate-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(8px) scale(0.99); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-light); }
    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .drop-cap::first-letter {
        float: left; font-size: 3.8rem; line-height: 3.2rem; padding-top: 0.1rem; padding-right: 0.6rem; color: var(--dark-color); font-weight: 900;
    }

    .receipt-container {
        background-color: #FFFFFF;
        background-image: radial-gradient(circle, #FAF7F2 10%, transparent 11%);
        background-size: 10px 10px;
    }
    .receipt-edge-zigzag {
        background: linear-gradient(-135deg, #FFF 5px, transparent 0), linear-gradient(135deg, #FFF 5px, transparent 0);
        background-size: 10px 10px;
        background-repeat: repeat-x;
    }
</style>
