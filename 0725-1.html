    // Gemini API Helper Function with Exponential Backoff
    const callGeminiAPI = async (userQuery, systemInstruction = "", retryCount = 0) => {
        const apiKey = ""; // Runtime auto-supplied
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        
        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            ...(systemInstruction ? { systemInstruction: { parts: [{ text: systemInstruction }] } } : {})
        };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                if ((response.status === 429 || response.status >= 500) && retryCount < 3) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return callGeminiAPI(userQuery, systemInstruction, retryCount + 1);
                }
                throw new Error(`API 請求失敗: HTTP ${response.status}`);
            }

            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "暫時無法取得 AI 分析內容，請稍後重試。";
        } catch (error) {
            if (retryCount < 3) {
                const delay = Math.pow(2, retryCount) * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));
                return callGeminiAPI(userQuery, systemInstruction, retryCount + 1);
            }
            throw error;
        }
    };

    const maskName = (name) => {
        if (!name || name === '-') return '-';
        const str = String(name).trim();
        if (str.length <= 1) return str;
        if (str.length === 2) return str[0] + "○";
        if (str.length === 3) return str[0] + "○" + str[2];
        let masked = "";
        for (let i = 0; i < str.length; i++) {
            if (i === 0 || i === 2) masked += str[i];
            else masked += "○";
        }
        return masked;
    };

        return str.substring(0, 3) + "*".repeat(str.length - 6) + str.substring(str.length - 3);

        let strUrl = String(url).trim();

        let driveId = null;
        if (strUrl.includes('drive.google.com')) {

        cartMemoPlaceholder: '若有特殊收件時間或需求請填寫於此...',
        cartBtnCheckout: '確認下單並送出訂單',
        cartCheckingOutBtn: '訂單處理中...',
        cartOptionCash: '店取付現金 (預設)',
        cartOptionTransfer: '銀行劃撥/轉帳（運費另計）',
        cartTotalLabel: '總計金額',
        
        msgLoadingInventory: '完整庫存同步中...',
        msgLoadedInventory: '最新庫存已載入',
        msgLoadingMoreBooks: '正在載入更多書目...',
        msgOutOfStock: '已售罄',
        msgNoBooksFound: '目前沒有相關書籍喔！',
        msgSearchingBooks: '雲端書庫搜尋中...',
        
        urlAboutPresident: 'https://hanlinma.github.io/candyni/%E9%97%9C%E6%96%BC%E7%A4%BE%E9%95%B7.html',
        urlContactUs: 'https://hanlinma.github.io/candyni/%E8%81%AF%E7%B9%AB%E6%88%91%E5%80%91.html'
    };

    function App() {
        const [ui, setUi] = useState(defaultUI);
        const [settings, setSettings] = useState({
            systemName: '文史哲出版社',
            systemSubName: 'The Liberal Arts Press'
        });

        const [carousels, setCarousels] = useState(() => {
            const cached = localStorage.getItem('lapen_carousels_v4');
            if (cached) { try { const p = JSON.parse(cached); if(p.length > 0) return p; } catch(e) {} }
            return fallbackCarousels;
        });
        const [carouselIndex, setCarouselIndex] = useState(0); 
        
        const [books, setBooks] = useState(() => {
            const cached = localStorage.getItem('lapen_books_v4');
            if (cached) { try { const p = JSON.parse(cached); if(p.length > 0) return p.sort(() => 0.5 - Math.random()); } catch(e) {} }
            return fallbackBooks;
        });

        const [choiceBooks, setChoiceBooks] = useState([]);
        const [cart, setCart] = useState([]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isContactOpen, setIsContactOpen] = useState(false);
        const [notification, setNotification] = useState(null);
        
        const [isCartDetailsOpen, setIsCartDetailsOpen] = useState(true);
        const [selectedPayment, setSelectedPayment] = useState('店取付現金');

        const [isBooksLoading, setIsBooksLoading] = useState(true); 
        const [isCheckingOut, setIsCheckingOut] = useState(false);
        const [isSubmittingCS, setIsSubmittingCS] = useState(false);

        const [lastActionTime, setLastActionTime] = useState(0);

        const [selectedCategory, setSelectedCategory] = useState('全部');
        const [visibleCount, setVisibleCount] = useState(8); 
        
        const [iframeModal, setIframeModal] = useState({ isOpen: false, url: '', title: '' });
        const [isAboutOpen, setIsAboutOpen] = useState(false);

        const [isSearchModalOpen, setIsSearchModalOpen] = useState(false);
        const [isRandomBooksOpen, setIsRandomBooksOpen] = useState(false);

        const [searchForm, setSearchForm] = useState({ code: '', title: '', author: '', year: '', category: '' });
        const [appliedSearch, setAppliedSearch] = useState({ code: '', title: '', author: '', year: '', category: '' });
        const [searchVisibleCount, setSearchVisibleCount] = useState(8);

        const [randomBooks, setRandomBooks] = useState([]);
        
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        const [showBackToTop, setShowBackToTop] = useState(false);
        const [isAllCategoriesExpanded, setIsAllCategoriesExpanded] = useState(false);

        const [submittedDetail, setSubmittedDetail] = useState(null);
        
        const [isOrderQueryOpen, setIsOrderQueryOpen] = useState(false);
        const [orderQueryInput, setOrderQueryInput] = useState('');
        const [queryResults, setQueryResults] = useState([]);
        const [isQueryingGAS, setIsQueryingGAS] = useState(false);
        const [hasQueried, setHasQueried] = useState(false);

        // AI Gemini Feature States
        const [isAiModalOpen, setIsAiModalOpen] = useState(false);
        const [aiActiveTab, setAiActiveTab] = useState('guide'); 
        const [selectedAiBook, setSelectedAiBook] = useState(null);
        const [aiAnalysisResult, setAiAnalysisResult] = useState('');
        const [isAiLoading, setIsAiLoading] = useState(false);
        const [aiChatMessages, setAiChatMessages] = useState([
            { role: 'model', text: '您好！我是文史哲出版社的「AI 閱覽顧問」。請問您最近對哪領域的國學、歷史、哲學或文學主題感興趣？我可以為您導覽選書與解答學術議題。' }
        ]);
        const [aiChatInput, setAiChatInput] = useState('');
        
        const sliderRef = useRef(null);

        const showMsg = (text) => {
            setNotification(text);
            setTimeout(() => setNotification(null), 3500);
        };

        const checkRateLimit = () => {
            const now = Date.now();
            if (now - lastActionTime < 12000) {
                const secondsLeft = Math.ceil((12000 - (now - lastActionTime)) / 1000);
                showMsg(`請稍候 ${secondsLeft} 秒後再試！`);
                return false;
            }
            return true;
        };

        useEffect(() => {
            const handleScroll = () => setShowBackToTop(window.scrollY > 300);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const syncWithGAS = async (action, payloadData = null) => {
            try {
                const currentOrigin = window.location.origin;
                const safeOrigin = currentOrigin.includes("usercontent.goog") 
                    ? "https://candylovema.github.io" 
                    : currentOrigin;

                const payloadObj = { action, payload: payloadData, origin: safeOrigin };
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payloadObj)
                });
                
                const data = await response.json();
                return data;
            } catch (e) {
                return { status: 'error', msg: e.toString() };
            }
        };

        useEffect(() => {
            syncWithGAS('FETCH_SETTINGS').then(res => {
                if (res && res.data) {
                    setSettings(prev => ({...prev, ...res.data}));
                    if (res.data.systemName) document.title = `${res.data.systemName} 有限公司｜極致美學人文學術出版`;
                }
            }).catch(() => {});

            syncWithGAS('FETCH_UI').then(res => {
                if (res && res.data) {
                    setUi(prev => ({...prev, ...res.data}));
                    if (res.data.frontendName) document.title = `${res.data.frontendName} 官方網站`;
                }
            }).catch(() => {});

            syncWithGAS('FETCH_CAROUSELS').then(res => {
                if (res && Array.isArray(res.data)) {
                    const published = res.data.filter(c => c.status === '已發佈');
                    if (published.length > 0) {
                        setCarousels(published);
                        localStorage.setItem('lapen_carousels_v4', JSON.stringify(published));
                    }
                }
            }).catch(() => {});

            syncWithGAS('FETCH_CHOICES').then(res => {
                if (res && Array.isArray(res.data)) {
                    const valid = res.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                    setChoiceBooks(valid);
                }
            }).catch(() => {});

            syncWithGAS('FETCH_BOOKS').then(res => {
                if (res && Array.isArray(res.data)) {
                    const valid = res.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                    const shuffled = valid.sort(() => 0.5 - Math.random());
                    setBooks(shuffled);
                    try { localStorage.setItem('lapen_books_v4', JSON.stringify(shuffled.slice(0, 150))); } catch (e) {}
                }
            }).finally(() => setIsBooksLoading(false));
        }, []);

        const handleOrderQuerySubmit = async (e) => {
            e.preventDefault();
            const term = orderQueryInput.trim().toLowerCase();
            if (term.length < 2) return showMsg("請輸入至少 2 個字進行比對");
            
            setIsQueryingGAS(true);
            setHasQueried(true);
            setQueryResults([]);
            try {
                const res = await syncWithGAS('FETCH_ORDERS');
                if (res && res.status === 'success' && Array.isArray(res.data)) {
                    const filtered = res.data.filter(ord => {
                        const oId = String(ord.id || ord['訂單編號'] || '').toLowerCase();
                        const oCust = String(ord.customer || ord['客戶姓名'] || '').toLowerCase();
                        const oPhone = String(ord.phone || ord['電話'] || '').toLowerCase();
                        return oId.includes(term) || oCust.includes(term) || oPhone.includes(term);
                    });
                    setQueryResults(filtered);
                } else showMsg(res.msg || "未能取得訂單記錄");
            } catch (error) {
                showMsg("查詢出錯，請稍候重試");
            } finally {
                setIsQueryingGAS(false);
            }
        };

        const handleOpenAiGuide = async (book) => {
            setSelectedAiBook(book);
            setAiActiveTab('guide');
            setIsAiModalOpen(true);
            setAiAnalysisResult('');
            setIsAiLoading(true);

            const systemPrompt = `你是一位享譽華文世界、深具人文學術底蘊的「文史哲出版社」總編輯與典藏專家。請用優雅、典雅且專業繁體中文為讀者剖析書籍。`;
            const queryPrompt = `請為以下這本出版品進行專業深度導讀與價值分析：
【書名】：${book.title}
【作者】：${book.author || '典藏專家精選'}
【類別】：${book.category || '人文學術'}
【出版年份】：${book.year || '不詳'}

請列出：
1. 💡 **核心精髓與學術價值**（150字內重點解析）
2. 📖 **適合閱讀族群**（列出2-3類讀者）
3. 🖋️ **推薦閱讀切入點**（建議如何品讀此書）`;

            try {
                const text = await callGeminiAPI(queryPrompt, systemPrompt);
                setAiAnalysisResult(text);
            } catch (err) {
                setAiAnalysisResult("連線至 AI 服務時發生錯誤，請確認網路連線或稍後再試。");
            } finally {
                setIsAiLoading(false);
            }
        };

        const handleSendAiChatMessage = async (e) => {
            e?.preventDefault();
            if (!aiChatInput.trim() || isAiLoading) return;

            const userText = aiChatInput.trim();
            setAiChatInput('');
            setAiChatMessages(prev => [...prev, { role: 'user', text: userText }]);
            setIsAiLoading(true);

            const systemPrompt = `你扮演「文史哲出版社」官方智慧閱覽顧問與學術總編輯。
文史哲出版社創立於1971年，專注文學、歷史、哲學、藝術史、語言學及人文社會科學專業學術論著出版。
你的回答風格：高雅、沉穩、富有文化學術涵養，使用繁體中文。請積極根據讀者詢問主題推薦閱讀方向與解答。`;

            try {
                const text = await callGeminiAPI(userText, systemPrompt);
                setAiChatMessages(prev => [...prev, { role: 'model', text: text }]);
            } catch (err) {
                setAiChatMessages(prev => [...prev, { role: 'model', text: '抱歉，AI 服務暫時無回應，請稍後重試。' }]);
            } finally {
                setIsAiLoading(false);
            }
        };

        useEffect(() => {
            if (carousels.length <= 1) return;
            const timer = setInterval(() => setCarouselIndex((prev) => (prev + 1) % carousels.length), 6000); 
            return () => clearInterval(timer);
        }, [carousels.length]);

        const dynamicCategories = useMemo(() => {
            const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
            const combined = ['全部', '文史哲學集成', ...cats.filter(c => c !== '文史哲學集成' && c !== '全部')];
            return [...new Set(combined)];
        }, [books]);

        const visibleCategories = useMemo(() => {
            return isAllCategoriesExpanded ? dynamicCategories : dynamicCategories.slice(0, 6);
        }, [dynamicCategories, isAllCategoriesExpanded]);

        const excelCategories = useMemo(() => {
            const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
            return [...new Set(cats)].sort();
        }, [books]);

        const filteredBooks = useMemo(() => {
            if (selectedCategory === '全部') return books;
            return books.filter(b => b.category === selectedCategory);
        }, [books, selectedCategory]);

        const visibleBooks = filteredBooks.slice(0, visibleCount);
        const displayChoiceBooks = choiceBooks.length > 0 ? choiceBooks : books.slice(0, 10);

        const openRandomBooksModal = () => {
            setIsMobileMenuOpen(false);
            if (books.length > 0) {
                const shuffled = [...books].sort(() => 0.5 - Math.random());
                setRandomBooks(shuffled.slice(0, 8));
            }
            setIsRandomBooksOpen(true);
        };

        const handleSearchSubmit = (e) => {
            e.preventDefault();
            setAppliedSearch(searchForm);
            setSearchVisibleCount(8);
        };

        const indexSearchBooks = useMemo(() => {
            return books.filter(b => {
                const matchCode = !appliedSearch.code || (b.id && b.id.toString().includes(appliedSearch.code));
                const matchTitle = !appliedSearch.title || (b.title && b.title.includes(appliedSearch.title));
                const matchAuthor = !appliedSearch.author || (b.author && b.author.includes(appliedSearch.author));
                const matchPage = !appliedSearch.year || (b.year && b.year.toString().includes(appliedSearch.year));
                const matchCat = !appliedSearch.category || appliedSearch.category === '全部' || b.category === appliedSearch.category;
                return matchCode && matchTitle && matchAuthor && matchPage && matchCat;
            });
        }, [books, appliedSearch]);

        const visibleSearchBooks = indexSearchBooks.slice(0, searchVisibleCount);

        const addToCart = (book) => {
            if (book.stock <= 0) return showMsg("抱歉，此書籍目前缺貨中！");
            setCart(prev => {
                const existing = prev.find(i => i.id === book.id);
                if (existing) {
                    return prev.map(i => i.id === book.id ? {...i, qty: i.qty + 1} : i);
                }
                return [...prev, {...book, qty: 1}];
            });
            showMsg(`已加入書包: ${book.title}`);
        };

        const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
        
        const updateCartQty = (id, delta) => {
            setCart(prev => prev.map(i => {
                if (i.id === id) {
                    const newQty = i.qty + delta;
                    if (newQty < 1) return null;
                    if (newQty > i.stock) { showMsg("已達可供庫存上限！"); return i; }
                    return { ...i, qty: newQty };
                }
                return i;
            }).filter(Boolean));
        };

        const cartTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

        const sanitizeInput = (val) => {
            if (val === undefined || val === null) return "";
            let str = String(val).trim();
            if (/^[=\+\-\@]/.test(str)) return "'" + str; 
            return str;
        };

        const handleCheckout = async (e) => {
            e.preventDefault();
            if (isCheckingOut || !checkRateLimit()) return;

            const formData = new FormData(e.target);
            const info = Object.fromEntries(formData);

            const name = sanitizeInput(info.name);
            const phone = sanitizeInput(info.phone);
            const email = sanitizeInput(info.email);
            const address = sanitizeInput(info.address);
            const memo = sanitizeInput(info.memo);

            if (name.length < 2) return showMsg("請輸入正確的收件人姓名");
            if (!/^\+?[0-9\-\s]{8,15}$/.test(info.phone.replace(/[^0-9\+]/g, ''))) return showMsg("請輸入有效的聯絡電話");
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(info.email)) return showMsg("請輸入正確的電子信箱格式");
            if (address.length < 6) return showMsg("請輸入正確的詳細寄送地址");

            setIsCheckingOut(true);
            setLastActionTime(Date.now()); 
            showMsg("訂單處理中，請稍候...");
            
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const formattedDate = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            
            const rawItems = cart.map(i => ({ title: i.title, qty: i.qty, price: i.price }));
            const itemsStr = cart.map(i => `${sanitizeInput(i.title)} (數量: ${i.qty})`).join('\n');
            
            const dateStr = `${now.getFullYear().toString().slice(-2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
            const randStr = Math.floor(1000 + Math.random() * 9000); 
            const orderId = `ORD-${dateStr}-${randStr}`;

            const newOrder = {
                id: orderId, customer: name, phone: phone, email: email, address: address, payment: info.payment,
                items: itemsStr, total: cartTotal, status: '處理中', date: formattedDate, memo: memo,
                '訂單編號': orderId, '客戶姓名': name, '電話': phone, '電子信箱': email, 'Email': email,
                '地址': address, '付款方式': info.payment, '購買項目': itemsStr, '總金額': cartTotal, '狀態': '處理中', '日期': formattedDate
            };
            
            const res = await syncWithGAS('CREATE_ORDER', newOrder);
            
            if (res && res.status === 'success') {
                setBooks(books.map(b => {
                    const ci = cart.find(c => c.id === b.id);
                    return ci ? { ...b, stock: b.stock - ci.qty } : b;
                }));
                
                setSubmittedDetail({
                    type: 'order',
                    data: {
                        id: orderId, customer: name, phone, email, address, payment: info.payment, memo, date: formattedDate, total: cartTotal, items: rawItems
                    }
                });

                setCart([]); 
                setIsCartOpen(false);
                showMsg(`訂單已成功送出！`);
            } else {
                showMsg(`訂單送出失敗：${res ? res.msg : '伺服器無回應'}`);
            }
            setIsCheckingOut(false);
        };

        const handleCSSubmit = async (e) => {
            e.preventDefault();
            if (isSubmittingCS || !checkRateLimit()) return;

            const name = sanitizeInput(e.target.name.value);
            const phone = sanitizeInput(e.target.phone.value);
            const email = sanitizeInput(e.target.email.value);
            const msg = sanitizeInput(e.target.message.value);

            if (name.length < 2) return showMsg("請輸入您的尊姓大名");
            if (!/^\+?[0-9\-\s]{8,15}$/.test(phone.replace(/[^0-9\+]/g, ''))) return showMsg("請輸入有效的聯絡電話");
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg("請輸入正確的電子信箱格式");
            if (msg.length < 5) return showMsg("反映內容請至少輸入5個字");

            setIsSubmittingCS(true);
            setLastActionTime(Date.now()); 
            showMsg("訊息傳送中...");
            
            const combinedQuery = `【聯絡電話】${phone}\n【Email信箱】${email}\n─────────────────\n【反映內容】\n${msg}`;
            const submitId = `CS-${Date.now().toString().slice(-6)}`;

            const newLog = { id: submitId, platform: 'Web官網', user: name, query: combinedQuery };
            const res = await syncWithGAS('NEW_CS_MSG', newLog);
            
            setIsSubmittingCS(false);
            if (res && res.status === 'success') {
                setSubmittedDetail({
                    type: 'cs',
                    data: { id: submitId, name, phone, email, message: msg, date: new Date().toLocaleString() }
                });
                setIsContactOpen(false);
                showMsg("感謝您的寶貴建議，專員將盡快覆核！");
            } else {
                showMsg(`發送失敗：${res ? res.msg : '伺服器無回應'}`);
            }
        };

        const scrollSlider = (direction) => {
            if (sliderRef.current) {
                const { scrollLeft, clientWidth } = sliderRef.current;
                const scrollTo = direction === 'left' ? scrollLeft - clientWidth * 0.8 : scrollLeft + clientWidth * 0.8;
                sliderRef.current.scrollTo({ left: scrollTo, behavior: 'smooth' });
            }
        };

        const renderListFromLines = (text, defaultLines) => {
            const lines = text ? text.split('\n').filter(l => l.trim() !== '') : defaultLines;
            return lines.map((line, idx) => <li key={idx} className="leading-relaxed">{line}</li>);
        };

        const rootStyle = {
            '--primary-color': ui.themeColor || '#8C5A2B',
            '--dark-color': ui.darkThemeColor || '#1C1613',
            '--bg-color': ui.lightBgColor || '#FAF7F2',
            '--bg-light': ui.bgLightColor || '#F4EFE6',
            '--text-dark': ui.textDarkColor || '#3D2D24',
            '--border-color': ui.borderColor || '#E2D3C1',
            '--accent-color': ui.accentColor || '#B89973',
            '--footer-bg': ui.footerBgColor || '#140E0C',
            '--body-font': ui.bodyFont || 'Noto Sans TC',
            '--title-font': ui.titleFont || 'Noto Serif TC',
        };

        return (
            <div style={rootStyle} className="min-h-screen bg-[var(--bg-color)] font-serif relative transition-colors duration-500 flex flex-col overflow-x-hidden">
                
                {/* Glowing Ambient Spheres */}
                <div className="fixed top-0 left-1/4 w-[650px] h-[650px] glow-aura-1 pointer-events-none -z-10 rounded-full blur-3xl opacity-70"></div>
                <div className="fixed bottom-1/3 right-10 w-[750px] h-[750px] glow-aura-2 pointer-events-none -z-10 rounded-full blur-3xl opacity-60"></div>

                {/* Navbar Header */}
                <nav className="px-5 md:px-12 py-4 border-b border-[var(--border-color)] flex justify-between items-center glass-nav sticky top-0 z-40 transition-all shadow-sm">
                    <div className="flex items-center space-x-3 cursor-pointer select-none group" onClick={() => {
                        if (window.innerWidth < 1024) setIsMobileMenuOpen(!isMobileMenuOpen);
                        else window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}>
                        <div className="p-2 rounded-2xl bg-white/80 border border-[var(--border-color)] group-hover:border-[var(--primary-color)] transition-all shadow-sm">
                            {ui.frontendLogoUrl ? (
                                <img src={formatImageUrl(ui.frontendLogoUrl)} className="w-8 h-8 md:w-9 md:h-9 object-contain" alt="Logo" onError={(e)=>{e.target.style.display='none'}} />
                            ) : (
                                <ModernLogo className="w-8 h-8 md:w-9 md:h-9" />
                            )}
                        </div>
                        <div className="flex flex-col">
                            <div className="flex items-center gap-1.5">
                                <h1 className="text-lg md:text-[22px] font-black text-[var(--dark-color)] tracking-[0.08em] font-sans group-hover:text-[var(--primary-color)] transition-colors">{ui.frontendName || settings.systemName}</h1>
                                <ChevronDown className={`lg:hidden transition-transform text-[var(--primary-color)] ${isMobileMenuOpen ? 'rotate-180' : ''}`} size={16} />
                            </div>
                            <span className="text-[9px] tracking-[0.22em] text-[var(--primary-color)] font-sans font-bold uppercase block">{ui.systemSubName || settings.systemSubName}</span>
                        </div>

                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-5 md:p-8 font-sans bg-transparent flex flex-col">
                                {aiActiveTab === 'guide' ? (
                                    <div className="space-y-4">
                                        {selectedAiBook ? (
                                            <div className="flex flex-col md:flex-row gap-5 items-start bg-white/70 p-4 rounded-2xl border border-[var(--border-color)] shadow-sm">
                                                <img src={formatImageUrl(selectedAiBook.cover)} alt={selectedAiBook.title} className="w-24 h-32 object-cover rounded-lg border shadow-sm shrink-0" onError={(e)=>{e.target.src='https://via.placeholder.com/150'}} />
                                                <div className="flex-1">
                                                    <span className="text-[10px] font-bold text-[var(--primary-color)] uppercase tracking-wider">{selectedAiBook.category}</span>
                                                    <h3 className="font-serif font-black text-xl text-[var(--dark-color)] mb-1">{selectedAiBook.title}</h3>
                                                    <p className="text-xs text-gray-600 mb-3">作者：{selectedAiBook.author || '典藏著作'} ｜ 定價：NT$ {selectedAiBook.price}</p>
                                                    <button type="button" onClick={() => addToCart(selectedAiBook)} className="bg-[var(--primary-color)] text-white px-4 py-1.5 rounded-full text-xs font-bold hover:bg-[var(--dark-color)] transition inline-flex items-center gap-1.5 shadow-sm">
                                                        <ShoppingCart size={13} /> 加入書包
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-4 text-xs">
                                                💡 提示：點擊任何書籍卡片上的「<strong>✨ AI 導讀</strong>」按鈕，即可在此查看該書籍的專屬深度解析。
                                            </div>
                                        )}

                                        <div className="glass-card p-5 rounded-2xl border border-white min-h-[200px] relative">
                                            {isAiLoading ? (
                                                <div className="py-16 text-center text-[var(--primary-color)] font-bold flex flex-col items-center justify-center gap-3">
                                                    <RefreshCw className="animate-spin" size={32} />
                                                    <span className="text-xs">Gemini 正在深入研讀本論著並撰寫導讀分析...</span>
                                                </div>
                                            ) : aiAnalysisResult ? (
                                                <div className="prose text-xs md:text-sm text-[var(--dark-color)] leading-relaxed whitespace-pre-wrap font-sans">
                                                    {aiAnalysisResult}
                                                </div>
                                            ) : (
                                                <div className="py-12 text-center text-gray-400 font-bold text-xs flex flex-col items-center gap-2">
                                                    <Sparkles size={28} />
                                                    <span>尚未選擇導讀書籍。請點擊首頁或檢索頁面中的「AI 導讀」按鈕。</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex-1 flex flex-col h-full space-y-4">
                                        <div className="flex-1 overflow-y-auto space-y-3 pr-2 min-h-[280px]">
                                            {aiChatMessages.map((msg, idx) => (
                                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs md:text-sm leading-relaxed shadow-sm ${
                                                        msg.role === 'user' 
                                                            ? 'bg-[var(--primary-color)] text-white font-medium rounded-tr-none' 
                                                            : 'bg-white/90 border border-[var(--border-color)] text-[var(--dark-color)] rounded-tl-none font-sans whitespace-pre-wrap'
                                                    }`}>
                                                        {msg.text}
                                                    </div>
                                                </div>
                                            ))}
                                            {isAiLoading && (
                                                <div className="flex justify-start">
                                                    <div className="bg-white/80 border border-[var(--border-color)] p-3 rounded-2xl rounded-tl-none text-xs text-[var(--primary-color)] font-bold flex items-center gap-2">
                                                        <RefreshCw className="animate-spin" size={14} /> 思考整理中...
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <form onSubmit={handleSendAiChatMessage} className="flex gap-2 shrink-0 pt-2 border-t border-[var(--border-color)]">
                                            <input 
                                                type="text" 
                                                value={aiChatInput} 
                                                onChange={(e) => setAiChatInput(e.target.value)} 
                                                placeholder="請輸入：想詢問的學術主題或想找的圖書類型..." 
                                                className="flex-1 border border-[var(--border-color)] glass-input p-3 rounded-xl text-xs outline-none font-bold text-[var(--dark-color)]"
                                            />
                                            <button 
                                                type="submit" 
                                                disabled={isAiLoading || !aiChatInput.trim()} 
                                                className="bg-[var(--primary-color)] hover:bg-[var(--dark-color)] text-white px-5 py-3 rounded-xl font-bold transition flex items-center justify-center shadow-md active:scale-95 disabled:opacity-50 text-xs shrink-0"
                                            >
                                                <Send size={15} />
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                {/* 5. Printable Invoice / Receipt Modal */}
                {submittedDetail && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[250] flex justify-center items-center p-4 md:p-8 overflow-y-auto">
                        <div className="bg-[var(--bg-color)] w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-fade-in-up border-4 border-double border-[var(--primary-color)] relative" onClick={(e)=>e.stopPropagation()}>
                            <div className="glass-dark text-[var(--bg-light)] p-4 flex justify-between items-center border-b-4 border-[var(--primary-color)]">
                                <span className="font-sans font-bold flex items-center gap-2 text-base tracking-wider">
                                    <CheckCircle className="text-emerald-400 animate-pulse" size={20} /> 
                                    {submittedDetail.type === 'order' ? '交易處理成功・受理憑證' : '反映受理成功・明細'}
                                </span>
                                <button type="button" onClick={() => setSubmittedDetail(null)} className="bg-white/10 hover:bg-white/20 p-1.5 rounded-full text-white"><X size={16} /></button>
                            </div>

                            <div className="p-6 md:p-8 bg-white receipt-container flex-1 relative overflow-hidden border-b-4 border-dashed border-gray-200">
                                <div className="text-center border-b-2 border-dashed border-[var(--border-color)] pb-4 mb-4">
                                    <h3 className="text-xl font-black tracking-widest text-[var(--dark-color)] mb-1 font-serif">文史哲出版社有限公司</h3>
                                    <p className="text-[10px] tracking-widest text-[var(--primary-color)] uppercase font-sans font-bold mb-2">{settings.systemSubName}</p>
                                    <span className="font-mono text-xs tracking-widest text-gray-500 font-bold select-all">{submittedDetail.data.id}</span>
                                </div>

                                {submittedDetail.type === 'order' ? (
                                    <div className="font-sans text-left space-y-3 text-gray-700 text-xs">
                                        <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center mb-4">
                                            <p className="text-emerald-800 font-bold text-sm mb-0.5">📸 請立即將此畫面截圖保存！</p>
                                            <p className="text-[11px] text-emerald-700">可作為劃撥對帳與取貨之正式憑證。</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-y-1.5 border-b border-gray-100 pb-3">
                                            <div><span className="text-gray-400">單號：</span><strong className="text-gray-800 font-mono">{submittedDetail.data.id}</strong></div>
                                            <div><span className="text-gray-400">日期：</span><strong className="text-gray-800">{submittedDetail.data.date}</strong></div>
                                            <div><span className="text-gray-400">客戶：</span><strong className="text-gray-800">{submittedDetail.data.customer}</strong></div>
                                            <div><span className="text-gray-400">電話：</span><strong className="text-gray-800">{submittedDetail.data.phone}</strong></div>
                                            <div className="col-span-2"><span className="text-gray-400">地址：</span><strong className="text-gray-800">{submittedDetail.data.address}</strong></div>
                                            <div className="col-span-2"><span className="text-gray-400">付款：</span><strong className="text-[var(--primary-color)] font-bold">{submittedDetail.data.payment}</strong></div>
                                        </div>
                                        <div className="py-1">
                                            <p className="font-bold text-[var(--dark-color)] mb-2">購買明細：</p>
                                            <div className="space-y-2 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                                {submittedDetail.data.items.map((it, idx) => (
                                                    <div key={idx} className="flex justify-between items-start text-xs text-gray-700">
                                                        <span className="font-bold pr-2 flex-1 line-clamp-1">{it.title}</span>
                                                        <span className="text-gray-500">x{it.qty}</span>
                                                        <span className="font-bold text-gray-900 w-16 text-right">NT$ {it.price * it.qty}</span>
                                                    </div>
                                                ))}
                                                <div className="border-t border-dashed border-gray-300 pt-2 mt-2 flex justify-between items-baseline">
                                                    <span className="font-bold text-gray-800">總金額</span>
                                                    <span className="text-xl font-black text-[var(--primary-color)] font-sans">NT$ {submittedDetail.data.total.toLocaleString()}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="font-sans text-left space-y-3 text-gray-700 text-xs">
                                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-center mb-4">
                                            <p className="text-blue-800 font-bold text-sm mb-0.5">📸 請截圖保存受理序號！</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-y-1.5 border-b border-gray-100 pb-3">
                                            <div><span className="text-gray-400">序號：</span><strong className="text-gray-800 font-mono">{submittedDetail.data.id}</strong></div>
                                            <div><span className="text-gray-400">日期：</span><strong className="text-gray-800">{submittedDetail.data.date}</strong></div>
                                        </div>
                                        <div className="py-1">
                                            <p className="font-bold text-[var(--dark-color)] mb-2">反映內容：</p>
                                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-200 text-xs text-gray-600 whitespace-pre-wrap leading-relaxed">
                                                {submittedDetail.data.message}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="receipt-edge-zigzag h-[10px] w-full bg-white relative pointer-events-none shrink-0"></div>

                            <div className="bg-gray-100 p-3 flex flex-col sm:flex-row gap-2 justify-center">
                                <button type="button" onClick={() => window.print()} className="bg-white border border-[var(--accent-color)] hover:bg-gray-50 text-[var(--text-dark)] py-2 px-5 rounded-xl font-bold flex justify-center items-center gap-1.5 text-xs shadow-sm"><Printer size={15}/> 列印 / 保存 PDF</button>
                                <button type="button" onClick={() => setSubmittedDetail(null)} className="bg-[var(--dark-color)] hover:bg-[var(--primary-color)] text-white py-2 px-6 rounded-xl font-bold flex justify-center items-center gap-1.5 text-xs shadow-md"><Check size={15}/> 關閉並繼續瀏覽</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Toast Notification */}
                {notification && (
                    <div className="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 glass-dark text-white px-5 py-3 rounded-2xl shadow-2xl animate-fade-in-up font-bold text-xs md:text-sm z-[300] flex items-center gap-2.5 border-l-4 border-[var(--primary-color)] whitespace-nowrap">
                        <CheckCircle size={18} className="text-[var(--accent-color)]" /> {notification}
                    </div>
                )}
            </div> 
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
