    // Security Masking Functions
    const maskName = (name) => {
        if (!name || name === '-') return '-';
        const str = String(name).trim();
        if (str.length <= 1) return str;
        if (str.length === 2) return str[0] + "○";
        if (str.length === 3) return str[0] + "○" + str[2];
        let masked = "";
        for (let i = 0; i < str.length; i++) {
            if (i === 0 || i === 2) masked += str[i];
            else masked += "○";
        }
        return masked;
    };

        let strUrl = String(url).trim();

        let driveId = null;
        if (strUrl.includes('drive.google.com')) {
            const match = strUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || strUrl.match(/id=([a-zA-Z0-9_-]+)/);

            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const syncWithGAS = async (action, payloadData = null) => {
            try {
                const currentOrigin = window.location.origin;
                const safeOrigin = currentOrigin.includes("usercontent.goog") ? "https://candylovema.github.io" : currentOrigin;
                const payloadObj = { action: action, payload: payloadData, origin: safeOrigin };
                const response = await fetch(GAS_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payloadObj)
                });
                return await response.json();
            } catch (e) {
                console.error("GAS Sync Error:", e);
                return { status: 'error', msg: e.toString() };
            }
        };

        useEffect(() => {
            syncWithGAS('FETCH_SETTINGS').then(res => {
                if (res?.data) {
                    setSettings(prev => ({...prev, ...res.data}));
                    document.title = `${res.data.systemName || '文史哲出版社'} 有限公司｜台灣人文學術出版社（首頁）`;
                }
            }).catch(()=>{});

            syncWithGAS('FETCH_UI').then(res => {
                if (res?.data) {
                    setUi(prev => ({...prev, ...res.data}));
                }
            }).catch(()=>{});

            syncWithGAS('FETCH_CAROUSELS').then(res => {
                if (res?.data && Array.isArray(res.data)) {
                    const published = res.data.filter(c => c.status === '已發佈');
                    if (published.length > 0) setCarousels(published);
                }
            }).catch(()=>{});

            syncWithGAS('FETCH_CHOICES').then(res => {
                if (res?.data && Array.isArray(res.data)) setChoiceBooks(res.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍'));
            }).catch(()=>{});

            syncWithGAS('FETCH_BOOKS').then(res => {
                if (res?.data && Array.isArray(res.data)) {
                    const validBooks = res.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                    setBooks(validBooks.sort(() => 0.5 - Math.random()));
                }
            }).finally(() => setIsBooksLoading(false));
        }, []);

        const handleOrderQuerySubmit = async (e) => {
            e.preventDefault();
            const term = orderQueryInput.trim().toLowerCase();
            if (term.length < 2) return showMsg("請輸入至少 2 個字以供精確比對");
            setIsQueryingGAS(true); setHasQueried(true); setQueryResults([]);
            try {
                const res = await syncWithGAS('FETCH_ORDERS');
                if (res?.status === 'success' && Array.isArray(res.data)) {
                    const filtered = res.data.filter(ord => {
                        const oId = String(ord.id || ord['訂單編號'] || '').toLowerCase();
                        const oCust = String(ord.customer || ord['客戶姓名'] || '').toLowerCase();
                        const oPhone = String(ord.phone || ord['電話'] || '').toLowerCase();
                        return oId.includes(term) || oCust.includes(term) || oPhone.includes(term);
                    });
                    setQueryResults(filtered);
                } else showMsg(res?.msg || "未能取得記錄");
            } catch (error) { showMsg("查詢出錯，請稍候重試"); } finally { setIsQueryingGAS(false); }
        };

        useEffect(() => {
            if (carousels.length <= 1) return;

            return () => clearInterval(timer);
        }, [carousels.length]);

        useEffect(() => {
            if (isBooksLoading || displayChoiceBooks.length <= 1) return;
            const autoPlayTimer = setInterval(() => {
                if (sliderRef.current) {
                    const { scrollLeft, scrollWidth, clientWidth } = sliderRef.current;
                    if (scrollLeft + clientWidth >= scrollWidth - 5) sliderRef.current.scrollTo({ left: 0, behavior: 'smooth' });
                    else sliderRef.current.scrollTo({ left: scrollLeft + 300, behavior: 'smooth' });
                }
            }, 4000);
            return () => clearInterval(autoPlayTimer);
        }, [books, choiceBooks, isBooksLoading]);

        const dynamicCategories = useMemo(() => {
            const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
            return [...new Set(['全部', '文史哲學集成', ...cats.filter(c => c !== '文史哲學集成' && c !== '全部')])];
        }, [books]);

        const visibleCategories = isAllCategoriesExpanded ? dynamicCategories : dynamicCategories.slice(0, 5);
        const excelCategories = useMemo(() => [...new Set(books.map(b => b.category).filter(c => c && c.trim() !== ""))].sort(), [books]);
        const filteredBooks = selectedCategory === '全部' ? books : books.filter(b => b.category === selectedCategory);
        const visibleBooks = filteredBooks.slice(0, visibleCount);

        const openRandomBooksModal = () => {

            return books.filter(b => {

                       (!appliedSearch.author || (b.author && b.author.includes(appliedSearch.author))) &&
                       (!appliedSearch.year || (b.year && b.year.toString().includes(appliedSearch.year))) &&
                       (!appliedSearch.category || appliedSearch.category === '全部' || b.category === appliedSearch.category);

        const visibleSearchBooks = indexSearchBooks.slice(0, searchVisibleCount);

        const addToCart = (book) => {
            if (book.stock <= 0) return showMsg("抱歉，目前缺貨中！");
            setCart(prev => {
                const existing = prev.find(i => i.id === book.id);
                if (existing) return prev.map(i => i.id === book.id ? {...i, qty: i.qty + 1} : i);
                return [...prev, {...book, qty: 1}];
            });
            showMsg(`已加入書包: ${book.title}`);
        };

        const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
        const updateCartQty = (id, delta) => {
            setCart(prev => prev.map(i => {
                if (i.id === id) {
                    const newQty = i.qty + delta;
                    if (newQty < 1) return null;
                    if (newQty > i.stock) { showMsg("已達庫存上限"); return i; }
                    return { ...i, qty: newQty };

                return i;

        };
        const cartTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

        const sanitizeInput = (val) => {
            if (val === undefined || val === null) return "";
            let str = String(val).trim();
            if (/^[=\+\-\@]/.test(str)) return "'" + str; 
            return str;
        };

        const handleCheckout = async (e) => {
            e.preventDefault();
            if (isCheckingOut || !checkRateLimit()) return;
            const info = Object.fromEntries(new FormData(e.target));
            const name = sanitizeInput(info.name); const phone = sanitizeInput(info.phone);
            const email = sanitizeInput(info.email); const address = sanitizeInput(info.address);
            const memo = sanitizeInput(info.memo);

            if (name.length < 2) return showMsg("請輸入正確的收件人姓名");
            if (address.length < 6) return showMsg("請輸入正確的詳細寄送地址");

            setIsCheckingOut(true); setLastActionTime(Date.now()); showMsg("訂單處理中，請稍候...");
            const now = new Date(); const pad = (n) => n.toString().padStart(2, '0');
            const formattedDate = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const rawItems = cart.map(i => ({ title: i.title, qty: i.qty, price: i.price }));
            const itemsStr = cart.map(i => `${sanitizeInput(i.title)} (數量: ${i.qty})`).join('\n');
            const orderId = `ORD-${now.getFullYear().toString().slice(-2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${Math.floor(1000 + Math.random() * 9000)}`;

            const newOrder = {
                id: orderId, customer: name, phone: phone, email: email, address: address, payment: info.payment,
                items: itemsStr, total: cartTotal, status: '處理中', date: formattedDate, memo: memo,
                '訂單編號': orderId, '客戶姓名': name, '電話': phone, '電子信箱': email, '地址': address, '付款方式': info.payment, '購買項目': itemsStr, '總金額': cartTotal, '狀態': '處理中', '日期': formattedDate
            };

            setIsCheckingOut(false);
        };

        const handleCSSubmit = async (e) => {

                <div className="fixed bottom-[-10%] right-[-10%] w-[45%] h-[45%] rounded-full bg-secondary/10 blur-[130px] pointer-events-none"></div>

                {/* Navbar */}
                <nav className="fixed w-full z-50 glass top-0 border-b border-black/80 shadow-2xl">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                            {/* Logo */}
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
                                {ui.frontendLogoUrl ? (
                                    <img src={formatImageUrl(ui.frontendLogoUrl)} className="w-9 h-9 object-contain group-hover:rotate-12 transition-transform duration-300" alt="Logo" onError={(e)=>{e.target.style.display='none'}} />
                                ) : (
                                    <ModernLogo className="w-9 h-9 group-hover:rotate-12 transition-transform duration-300" />
                                )}
                                <div>
                                    <h1 className="text-xl font-bold tracking-widest text-white font-serif group-hover:text-accent transition-colors">
                                        {ui.frontendName || settings.systemName}
                                    </h1>
                                    <span className="text-[9px] tracking-[0.25em] text-primary font-mono uppercase font-bold block">{ui.systemSubName || settings.systemSubName}</span>
                                </div>
                            </div>

                            {/* Navigation Bar Links */}
                            <div className="hidden lg:flex items-center space-x-6 text-sm font-semibold">
                                <button onClick={() => setIsAboutOpen(true)} className="hover:text-accent text-text-muted transition flex items-center gap-1.5"><Compass size={16} className="text-primary"/> {ui.menuAbout}</button>
                                <button onClick={() => setIframeModal({ isOpen: true, url: ui.urlAboutPresident, title: ui.menuPresident })} className="hover:text-accent text-text-muted transition flex items-center gap-1.5"><User size={16} className="text-primary"/> {ui.menuPresident}</button>
                                <button onClick={() => setIframeModal({ isOpen: true, url: ui.urlContactUs, title: ui.menuContact })} className="hover:text-accent text-text-muted transition flex items-center gap-1.5"><MessageCircle size={16} className="text-primary"/> {ui.menuContact}</button>
                                <button onClick={openRandomBooksModal} className="hover:text-accent text-text-muted transition flex items-center gap-1.5"><Zap size={16} className="text-primary"/> {ui.menuNewArrivals}</button>
                                <button onClick={() => setIsSearchModalOpen(true)} className="hover:text-accent text-text-muted transition flex items-center gap-1.5"><Search size={16} className="text-primary"/> {ui.menuSearch}</button>
                                <button onClick={() => setIsOrderQueryOpen(true)} className="bg-primary/20 border border-black/80 text-accent hover:bg-primary hover:text-white px-3.5 py-1.5 rounded-full transition flex items-center gap-1.5 shadow-sm"><FileText size={15}/> 訂單查詢</button>
                            </div>

                            {/* Right Cart & Admin Buttons */}
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsCartOpen(true)} className="relative glass hover:bg-white/10 px-4 py-2 rounded-full flex items-center gap-2 border border-black/80 transition group shadow-md">
                                    <ShoppingCart size={18} className="text-primary group-hover:scale-110 transition-transform" />
                                    <span className="text-sm font-bold hidden sm:inline">{ui.menuCart}</span>
                                    {cart.length > 0 && <span className="bg-secondary text-white text-[11px] px-2 py-0.5 rounded-full font-bold animate-bounce shadow-md">{cart.length}</span>}
                                </button>
                                
                                <button onClick={() => window.open(ui.footerFacebookUrl, '_blank')} className="hidden sm:flex bg-surface hover:bg-surface-hover border border-black/80 text-white px-4 py-2 rounded-full text-xs font-bold items-center gap-2 transition shadow-md">
                                    <LayoutDashboard size={15} className="text-accent" /> <span>{ui.menuAdmin}</span>

                                    {isMobileMenuOpen ? <X size={26} /> : <div className="space-y-1.5"><div className="w-6 h-0.5 bg-white"></div><div className="w-6 h-0.5 bg-white"></div><div className="w-4 h-0.5 bg-white"></div></div>}
                                </button>

                        </div>

                            <button onClick={() => { setIsMobileMenuOpen(false); setIframeModal({ isOpen: true, url: ui.urlAboutPresident, title: ui.menuPresident }); }} className="w-full text-left p-3 rounded-lg hover:bg-white/5 flex items-center gap-3 text-white font-bold"><User size={18} className="text-primary"/> {ui.menuPresident}</button>
                            <button onClick={() => { setIsMobileMenuOpen(false); setIframeModal({ isOpen: true, url: ui.urlContactUs, title: ui.menuContact }); }} className="w-full text-left p-3 rounded-lg hover:bg-white/5 flex items-center gap-3 text-white font-bold"><MessageCircle size={18} className="text-primary"/> {ui.menuContact}</button>
                            <button onClick={() => { setIsMobileMenuOpen(false); openRandomBooksModal(); }} className="w-full text-left p-3 rounded-lg hover:bg-white/5 flex items-center gap-3 text-white font-bold"><Zap size={18} className="text-primary"/> {ui.menuNewArrivals}</button>
                            <button onClick={() => { setIsMobileMenuOpen(false); setIsSearchModalOpen(true); }} className="w-full text-left p-3 rounded-lg hover:bg-white/5 flex items-center gap-3 text-white font-bold"><Search size={18} className="text-primary"/> {ui.menuSearch}</button>
                            <button onClick={() => { setIsMobileMenuOpen(false); setIsOrderQueryOpen(true); }} className="w-full text-left p-3 rounded-lg bg-primary/20 text-accent flex items-center gap-3 font-bold border border-black/60"><FileText size={18}/> 訂單查詢</button>
                            <button onClick={() => { setIsMobileMenuOpen(false); window.open(ui.footerFacebookUrl, '_blank'); }} className="w-full text-left p-3 rounded-lg hover:bg-white/5 flex items-center gap-3 text-text-muted font-bold"><LayoutDashboard size={18} className="text-accent"/> {ui.menuAdmin}</button>

                                        const slideLink = c.link || c.url || (isFbSlide ? ui.footerFacebookUrl : null);

                                        return (

                                                <img src={formatImageUrl(c.image)} alt="Banner" className="w-full h-full object-cover opacity-70" onError={(e)=>{e.target.src='https://images.unsplash.com/photo-1481627834876-b7833e8f5570?q=80&w=1200'}} />
                                                <div className="absolute bottom-0 left-0 w-full p-6 sm:p-12 z-20">

                                                    <div className="grid grid-cols-2 gap-2 text-text-muted pt-1">
                                                        <div>客戶: <span className="text-white">{maskName(ord.customer || ord['客戶姓名'])}</span></div>
                                                        <div>電話: <span className="text-white">{maskPhone(ord.phone || ord['電話'])}</span></div>
                                                        <div>日期: <span className="text-white">{ord.date || ord['日期']}</span></div>
                                                        <div>付款: <span className="text-white">{ord.payment || ord['付款方式']}</span></div>
                                                    </div>
                                                    <div className="bg-surface p-2.5 rounded border border-black/60 text-[11px] whitespace-pre-wrap font-mono text-slate-300 mt-2">
                                                        {ord.items || ord['購買項目']}
                                                    </div>
                                                    <div className="text-right font-mono font-bold text-accent text-sm pt-1">
                                                        總額: NT$ {ord.total || ord['總金額']}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                {}
                {/* Cart Slide-over Drawer with Glassmorphism & Restored Step Tabs */}
                {isCartOpen && (
                    <div className="fixed inset-0 z-[100] flex justify-end">
                        <div className="absolute inset-0 bg-base/80 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                        <div className="relative w-full max-w-xl h-full glass-heavy border-l border-black/80 flex flex-col animate-in right-0 shadow-2xl">
                            
                            {/* Step Navigation Tabs */}
                            <div className="flex border-b border-black/80 bg-white/5 text-xs font-bold font-sans shrink-0">
                                <button 
                                    type="button" 
                                    onClick={() => setIsCartDetailsOpen(true)}
                                    className={`flex-1 py-4 text-center transition-all flex items-center justify-center gap-1.5 border-b-2 ${isCartDetailsOpen ? 'border-primary text-primary bg-primary/10' : 'border-transparent text-text-muted hover:text-white'}`}
                                >
                                    <ShoppingCart size={15} />
                                    <span>1. 確認書包 ({cart.reduce((s, i) => s + i.qty, 0)}本)</span>
                                </button>
                                <button 
                                    type="button" 
                                    onClick={() => {
                                        if (cart.length > 0) setIsCartDetailsOpen(false);
                                        else showMsg("書包內尚無圖書，請先挑選書籍！");
                                    }}
                                    className={`flex-1 py-4 text-center transition-all flex items-center justify-center gap-1.5 border-b-2 ${!isCartDetailsOpen ? 'border-primary text-primary bg-primary/10' : 'border-transparent text-text-muted hover:text-white'}`}
                                >
                                    <FileText size={15} />
                                    <span>2. 收件結帳</span>
                                </button>
                                <button onClick={() => setIsCartOpen(false)} className="px-4 text-text-muted hover:text-white"><X size={18}/></button>
                            </div>

                            {/* Step 1: Cart Items List */}
                            {isCartDetailsOpen ? (
                                <div className="flex-1 flex flex-col overflow-hidden">
                                    <div className="p-4 border-b border-black/80 flex justify-between items-center bg-white/5">
                                        <h2 className="text-base font-bold text-white font-serif flex items-center gap-2"><ShoppingCart size={18} className="text-primary"/> {ui.cartTitle}</h2>
                                        <span className="text-xs text-text-muted font-mono">小計: NT$ {cartTotal.toLocaleString()}</span>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-5 custom-scrollbar space-y-4">
                                        {cart.length === 0 ? (
                                            <div className="h-full flex flex-col items-center justify-center text-text-muted text-xs space-y-3">
                                                <ShoppingCart size={40} className="opacity-20" />
                                                <p>{ui.cartEmptyText}</p>
                                            </div>
                                        ) : (
                                            cart.map(i => (
                                                <div key={i.id} className="flex gap-4 p-3 rounded-xl bg-surface border border-black/80 relative shadow-md">
                                                    <div className="w-14 h-18 bg-base rounded overflow-hidden shrink-0 border border-black/60">
                                                        <img src={formatImageUrl(i.cover)} className="w-full h-full object-cover" onError={(e)=>e.target.style.display='none'}/>
                                                    </div>
                                                    <div className="flex-1 flex flex-col justify-between">
                                                        <p className="font-serif text-xs font-bold text-white line-clamp-1 pr-6">{i.title}</p>
                                                        <p className="text-accent font-mono text-xs font-bold">NT$ {i.price}</p>
                                                        <div className="flex items-center bg-base rounded border border-black/80 h-6 text-xs w-max">
                                                            <button onClick={() => updateCartQty(i.id, -1)} className="px-2 text-text-muted hover:text-white">-</button>
                                                            <span className="px-2 border-x border-black/80 text-white font-mono">{i.qty}</span>
                                                            <button onClick={() => updateCartQty(i.id, 1)} className="px-2 text-text-muted hover:text-white">+</button>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => removeFromCart(i.id)} className="absolute top-2 right-2 text-text-muted hover:text-secondary"><Trash2 size={14}/></button>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {cart.length > 0 && (
                                        <div className="p-4 border-t border-black/80 bg-base/90">
                                            <button 
                                                onClick={() => setIsCartDetailsOpen(false)}
                                                className="w-full bg-primary hover:bg-accent text-white py-3 rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2 border border-black/60 text-sm"
                                            >
                                                <span>下一步：填寫收件資訊</span>
                                                <ChevronRight size={16} />
                                            </button>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                /* Step 2: Checkout Form & Instructions */
                                <div className="flex-1 overflow-y-auto p-5 custom-scrollbar space-y-4">
                                    <div className="flex justify-between items-baseline font-mono border-b border-black/80 pb-3">
                                        <span className="text-text-muted text-xs">{ui.cartTotalLabel}</span>
                                        <span className="text-2xl font-black text-accent">NT$ {cartTotal.toLocaleString()}</span>
                                    </div>

                                    <form onSubmit={handleCheckout} className="space-y-3 text-xs">
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-[11px] text-text-muted mb-1">{ui.cartLabelName}</label>
                                                <input name="name" required className="w-full bg-surface border border-black/80 p-2.5 rounded-lg text-white outline-none focus:border-primary" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] text-text-muted mb-1">{ui.cartLabelPhone}</label>
                                                <input name="phone" required className="w-full bg-surface border border-black/80 p-2.5 rounded-lg text-white outline-none focus:border-primary" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-text-muted mb-1">{ui.cartLabelEmail}</label>
                                            <input name="email" type="email" required className="w-full bg-surface border border-black/80 p-2.5 rounded-lg text-white outline-none focus:border-primary" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-text-muted mb-1">{ui.cartLabelAddress}</label>
                                            <input name="address" required className="w-full bg-surface border border-black/80 p-2.5 rounded-lg text-white outline-none focus:border-primary" />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-[11px] text-text-muted mb-1">{ui.cartLabelPayment}</label>
                                            <select name="payment" value={selectedPayment} onChange={(e)=>setSelectedPayment(e.target.value)} className="w-full bg-surface border border-black/80 p-2.5 rounded-lg text-white font-bold outline-none focus:border-primary">
                                                <option value="店取付現金" className="bg-[#151D2A] text-white">{ui.cartOptionCash}</option>
                                                <option value="銀行轉帳（運費另計）" className="bg-[#151D2A] text-white">{ui.cartOptionTransfer}</option>
                                            </select>
                                        </div>

                                        {/* Delivery/Pickup Info Cards */}
                                        {selectedPayment === '銀行轉帳（運費另計）' && (
                                            <div className="bg-amber/10 border border-amber/30 text-amber p-3 rounded-xl text-[11px] leading-relaxed space-y-1.5 animate-in">
                                                <p className="font-bold flex items-center gap-1">🏦 郵政劃撥資訊：</p>
                                                <p>來電詢問：<span className="font-mono font-bold">📞 886-02-2351-1028</span></p>
                                                <p>郵政劃撥帳號：<span className="font-mono font-bold">05128812</span> (戶名: 彭正雄)</p>
                                                <p className="pt-1">
                                                    <a href={ui.footerFacebookUrl} target="_blank" rel="noreferrer" className="text-accent underline font-bold inline-flex items-center gap-1">
                                                        📘 詳情請私訊臉書專頁詢問 ↗
                                                    </a>
                                                </p>
                                                <p className="text-[10px] text-amber/80 border-t border-amber/20 pt-1">※ 轉帳完成後，請於下方「寄件備註」填寫您的轉帳後五碼或劃撥單姓名以利對帳。</p>
                                            </div>
                                        )}

                                        {selectedPayment === '店取付現金' && (
                                            <div className="bg-emerald/10 border border-emerald/30 text-emerald p-3 rounded-xl text-[11px] leading-relaxed space-y-1 animate-in">
                                                <p className="font-bold flex items-center gap-1">🏪 門市取貨地點：</p>
                                                <p>台北市中正區羅斯福路一段72巷4號（文史哲門市）</p>
                                                <p className="text-[10px] text-emerald/80 pt-1">※ 書籍備妥後，客服專員將致電與您確認前來取書時間，屆時現場現金付款取書即可。</p>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-[11px] text-text-muted mb-1">{ui.cartLabelMemo}</label>
                                            <textarea name="memo" placeholder={ui.cartMemoPlaceholder} className="w-full bg-surface border border-black/80 p-2.5 rounded-lg text-white outline-none h-14 resize-none"></textarea>
                                        </div>

                                        <button disabled={isCheckingOut} className="w-full bg-primary hover:bg-accent text-white py-3 rounded-xl font-bold transition shadow-lg disabled:opacity-50 border border-black/60 text-sm">
                                            {isCheckingOut ? ui.cartCheckingOutBtn : ui.cartBtnCheckout}
                                        </button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </div>
                )}

                {}
                {/* Iframe View Modal (President / Contact page views) */}
                {iframeModal.isOpen && (
                    <div className="fixed inset-0 bg-base/80 backdrop-blur-md z-[150] flex justify-center items-center p-4" onClick={() => setIframeModal(prev => ({ ...prev, isOpen: false }))}>
                        <div className="bg-surface w-full max-w-5xl h-[85vh] rounded-2xl border border-black/80 shadow-2xl flex flex-col overflow-hidden animate-in" onClick={(e) => e.stopPropagation()}>
                            <div className="p-4 border-b border-black/80 flex justify-between items-center bg-white/5">
                                <h2 className="text-base font-bold text-white font-serif">{iframeModal.title}</h2>
                                <button onClick={() => setIframeModal(prev => ({ ...prev, isOpen: false }))} className="text-text-muted hover:text-white"><X size={18}/></button>
                            </div>
                            <div className="flex-1 w-full bg-white relative">
                                {iframeModal.url && <iframe src={iframeModal.url} className="w-full h-full border-0"></iframe>}
                            </div>
                        </div>
                    </div>
                )}

                {/* Submitted Order/CS Receipt Ticket Modal */}
                {submittedDetail && (
                    <div className="fixed inset-0 z-[200] flex justify-center items-center p-4 bg-base/90 backdrop-blur-xl printable-modal">
                        <div className="cyber-ticket glass-heavy w-full max-w-md rounded-2xl shadow-2xl animate-in overflow-hidden text-xs font-mono text-text-muted border border-black/80">
                            <div className="p-6 text-center border-b border-dashed border-slate-600">
                                <CheckCircle size={36} className="text-emerald mx-auto mb-3 animate-pulse" />
                                <h3 className="text-lg font-bold text-white tracking-widest mb-1">
                                    {submittedDetail.type === 'order' ? '交易處理成功・受理憑證' : '反映受理成功'}
                                </h3>
                                <p className="text-[10px] text-emerald">STATUS: VERIFIED & LOGGED</p>
                            </div>
                            <div className="p-6 space-y-2.5">
                                <div className="flex justify-between"><span>序號/單號:</span> <span className="text-white font-bold">{submittedDetail.data.id}</span></div>
                                <div className="flex justify-between"><span>日期:</span> <span className="text-white">{submittedDetail.data.date}</span></div>
                                <div className="flex justify-between"><span>姓名:</span> <span className="text-white">{submittedDetail.data.customer || submittedDetail.data.name}</span></div>
                                
                                {submittedDetail.type === 'order' && (
                                    <>
                                        <div className="ticket-dashed-line"></div>
                                        <div className="text-[10px] uppercase mb-2 text-slate-400">訂購圖書項目</div>
                                        {submittedDetail.data.items.map((it, i) => (
                                            <div key={i} className="flex justify-between text-white">
                                                <span className="truncate pr-2 flex-1">{it.title}</span>
                                                <span>x{it.qty}</span>
                                            </div>
                                        ))}
                                        <div className="ticket-dashed-line"></div>
                                        <div className="flex justify-between items-center text-sm">
                                            <span>總金額:</span>
                                            <span className="text-xl font-bold text-accent">NT$ {submittedDetail.data.total.toLocaleString()}</span>
                                        </div>
                                    </>
                                )}
                            </div>
                            <div className="bg-slate-900/90 p-4 flex gap-3 no-print border-t border-black/80">
                                <button onClick={() => window.print()} className="flex-1 border border-slate-600 hover:bg-slate-800 py-2 rounded text-white transition flex justify-center items-center gap-1.5"><Printer size={14}/> 列印明細</button>
                                <button onClick={() => setSubmittedDetail(null)} className="flex-1 bg-primary text-white py-2 rounded transition font-bold border border-black/60">確認關閉</button>
                            </div>
                        </div>
                    </div>
                )}

                {}
                {/* Notifications */}
                {notification && (
                    <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[300] glass border border-black/80 text-white px-6 py-3 rounded-full shadow-2xl animate-in font-mono text-xs flex items-center gap-2">
                        <Zap size={15} className="text-accent animate-pulse" /> {notification}
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
