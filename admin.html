<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文史哲出版社｜管理後台系統</title>
<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<script>
    window.tailwind = {
        config: {
            theme: {
                extend: {
                    colors: {
                        primary: '#8C5A2B',
                        'primary-dark': '#6B421E',
                        'primary-light': '#D4A373',
                        dark: '#241D17',
                        cardDark: '#1E1712',
                        bgLight: '#FAF8F5',
                        borderLight: '#E8DCCE',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>window.react = window.React;</script>

<!-- 靜態數據源 -->
<script src="data.js"></script>

<style>
    :root {
        --primary: #8C5A2B;
        --dark: #241D17;
    }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #F7F4EF;
        color: #2C241B;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #EFE9E1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5B5A5; border-radius: 99px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8C5A2B; }
    
    .badge-primary { background: #8C5A2B; color: #FFF; }
    .badge-pending { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
    .badge-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
    .badge-info { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }
    .badge-danger { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
</style>
</head>
<body>
<div id="admin-root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #241D17; color: #FAF8F5; font-family: 'Noto Serif TC', serif;">
        <div style="width: 48px; height: 48px; border: 4px solid #8C5A2B; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">文史哲出版社</h2>
        <p style="font-size: 13px; color: #BFAF9E; font-family: sans-serif;">載入管理後台系統中，請稍候...</p>
    </div>
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</div>

<!-- 預編譯之純 JS 應用程式 (無須 Babel Standalone，0秒即時啟動) -->
<script src="admin_app.js"></script>
</body>
</html>
