<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文史哲出版社｜管理後台系統</title>
<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<script>
    window.tailwind = {
        config: {
            theme: {
                extend: {
                    colors: {
                        primary: '#8C5A2B',
                        'primary-dark': '#6B421E',
                        'primary-light': '#D4A373',
                        dark: '#241D17',
                        cardDark: '#1E1712',
                        bgLight: '#FAF8F5',
                        borderLight: '#E8DCCE',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>window.react = window.React;</script>
<script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>

<!-- 載入靜態數據源 -->
<script src="data.js"></script>

<style>
    :root {
        --primary: #8C5A2B;
        --dark: #241D17;
    }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #F7F4EF;
        color: #2C241B;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #EFE9E1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5B5A5; border-radius: 99px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8C5A2B; }
    
    .badge-primary { background: #8C5A2B; color: #FFF; }
    .badge-pending { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
    .badge-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
    .badge-info { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }
    .badge-danger { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
</style>
</head>
<body>
<div id="admin-root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// 預設後端 GAS 網址（可由後台設定頁動態修改）
const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwokskAB0yjrBz3aIhK9QI_phYEH6KtKoEMrLLKWzOooYjABVF0Nsqs2idMzxKyjqr3/exec";
const DEFAULT_PASS = "lapen_admin_888";

const SVG_FALLBACK = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='140' viewBox='0 0 100 140'%3E%3Crect width='100%25' height='100%25' fill='%23EDE5DC'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='11' fill='%238C5A2B'%3E封面暫缺%3C/text%3E%3C/svg%3E";

function AdminApp() {
    // 登入狀態
    const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return sessionStorage.getItem('lapen_admin_logged') === 'true';
    });
    const [passwordInput, setPasswordInput] = useState('');
    const [loginError, setLoginError] = useState('');
    const [savedPassword, setSavedPassword] = useState(() => {
        return localStorage.getItem('lapen_admin_pwd') || DEFAULT_PASS;
    });

    // 導覽標籤
    const [activeTab, setActiveTab] = useState('books'); // dashboard, books, orders, cs, carousels, settings

    // 後端與連線設定
    const [gasUrl, setGasUrl] = useState(() => {
        return localStorage.getItem('lapen_gas_url') || DEFAULT_GAS_URL;
    });
    const [isSyncing, setIsSyncing] = useState(false);
    const [syncMessage, setSyncMessage] = useState(null);

    // 核心資料狀態
    const staticData = (typeof window !== "undefined" && window.STATIC_DATA) || {};
    const [books, setBooks] = useState(() => {
        const cached = localStorage.getItem('lapen_admin_books');
        if (cached) { try { return JSON.parse(cached); } catch(e) {} }
        return staticData.books || [];
    });
    const [orders, setOrders] = useState(() => {
        const cached = localStorage.getItem('lapen_admin_orders');
        if (cached) { try { return JSON.parse(cached); } catch(e) {} }
        return [
            {
                orderId: "ORD20260825001",
                date: "2026/08/25 18:30:12",
                name: "王大明",
                phone: "0912-345-678",
                email: "wang@example.com",
                address: "台北市大安區和平東路一段 100 號",
                items: "《中國圖書史略》x 1, 《滿文原檔選讀譯注》x 1",
                total: 1020,
                payment: "店取付現金",
                memo: "請協助挑選書況良好之書籍，感謝！",
                status: "待處理",
                adminNote: ""
            }
        ];
    });
    const [csMessages, setCsMessages] = useState(() => {
        const cached = localStorage.getItem('lapen_admin_cs');
        if (cached) { try { return JSON.parse(cached); } catch(e) {} }
        return [
            {
                id: "CS2026082501",
                date: "2026/08/25 19:15:00",
                name: "陳教授",
                phone: "0922-888-999",
                email: "chen@univ.edu.tw",
                content: "請問《滿語叢刊》一套 50 冊是否有提供大學研究室採購優惠折扣？",
                status: "未處理",
                replyNote: ""
            }
        ];
    });
    const [carousels, setCarousels] = useState(() => {
        const cached = localStorage.getItem('lapen_admin_carousels');
        if (cached) { try { return JSON.parse(cached); } catch(e) {} }
        return staticData.carousels || [];
    });
    const [settings, setSettings] = useState(() => {
        const cached = localStorage.getItem('lapen_admin_settings');
        if (cached) { try { return JSON.parse(cached); } catch(e) {} }
        return staticData.settings || {};
    });

    // 書籍管理 UI 狀態
    const [bookSearch, setBookSearch] = useState('');
    const [bookCatFilter, setBookCatFilter] = useState('全部');
    const [bookPage, setBookPage] = useState(1);
    const [pageSize, setPageSize] = useState(25);
    const [editingBook, setEditingBook] = useState(null); // null = 不顯示 modal, 'NEW' = 新增, object = 編輯
    const [bookFormData, setBookFormData] = useState({
        id: '',
        title: '',
        author: '',
        year: '',
        price: '',
        isbn: '',
        stock: '10',
        category: '文學',
        isNew: false,
        isLast: false,
        cover: '',
        intro: '',
        心得: ''
    });

    // 訂單管理 UI 狀態
    const [orderFilter, setOrderFilter] = useState('全部');
    const [orderSearch, setOrderSearch] = useState('');
    const [viewingOrder, setViewingOrder] = useState(null);

    // 客服管理 UI 狀態
    const [csFilter, setCsFilter] = useState('全部');
    const [viewingCs, setViewingCs] = useState(null);

    // 輪播管理 UI 狀態
    const [editingCarousel, setEditingCarousel] = useState(null);

    // 提示訊息通知
    const showToast = (msg, type = 'info') => {
        setSyncMessage({ msg, type });
        setTimeout(() => setSyncMessage(null), 3500);
    };

    // 自動快照到 LocalStorage
    useEffect(() => {
        localStorage.setItem('lapen_admin_books', JSON.stringify(books));
    }, [books]);
    useEffect(() => {
        localStorage.setItem('lapen_admin_orders', JSON.stringify(orders));
    }, [orders]);
    useEffect(() => {
        localStorage.setItem('lapen_admin_cs', JSON.stringify(csMessages));
    }, [csMessages]);
    useEffect(() => {
        localStorage.setItem('lapen_admin_carousels', JSON.stringify(carousels));
    }, [carousels]);

    // 處理登入
    const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === savedPassword) {
            setIsLoggedIn(true);
            sessionStorage.setItem('lapen_admin_logged', 'true');
            setLoginError('');
            showToast('管理員登入成功！歡迎使用後台系統', 'success');
        } else {
            setLoginError('密碼不正確，請重新輸入（預設密碼為：lapen_admin_888）');
        }
    };

    // 處理登出
    const handleLogout = () => {
        setIsLoggedIn(false);
        sessionStorage.removeItem('lapen_admin_logged');
        setPasswordInput('');
    };

    // 取得現有所有分類清單
    const categoriesList = useMemo(() => {
        const set = new Set();
        books.forEach(b => { if (b.category && b.category.trim()) set.add(b.category.trim()); });
        return ['全部', ...Array.from(set).sort()];
    }, [books]);

    // 篩選後書籍清單
    const filteredBooks = useMemo(() => {
        const q = bookSearch.trim().toLowerCase();
        return books.filter(b => {
            const matchCat = bookCatFilter === '全部' || b.category === bookCatFilter;
            if (!matchCat) return false;
            if (!q) return true;
            return (
                String(b.id || '').toLowerCase().includes(q) ||
                String(b.title || '').toLowerCase().includes(q) ||
                String(b.author || '').toLowerCase().includes(q) ||
                String(b.year || '').toLowerCase().includes(q) ||
                String(b.isbn || '').toLowerCase().includes(q)
            );
        });
    }, [books, bookSearch, bookCatFilter]);

    // 分頁計算
    const totalPages = Math.ceil(filteredBooks.length / pageSize) || 1;
    const paginatedBooks = useMemo(() => {
        const start = (bookPage - 1) * pageSize;
        return filteredBooks.slice(start, start + pageSize);
    }, [filteredBooks, bookPage, pageSize]);

    // 開啟書籍編輯 Modal
    const handleOpenEditBook = (book = null) => {
        if (book) {
            setEditingBook(book);
            setBookFormData({
                id: book.id || '',
                title: book.title || '',
                author: book.author || '',
                year: book.year || '',
                price: book.price !== undefined ? book.price : '',
                isbn: book.isbn || '',
                stock: book.stock !== undefined ? book.stock : '10',
                category: book.category || '文學',
                isNew: !!book.isNew,
                isLast: !!book.isLast,
                cover: book.cover || book.image || '',
                intro: book.intro || '',
                心得: book.心得 || book.review || ''
            });
        } else {
            // 新增書籍
            const nextId = String(books.length + 1).padStart(5, '0');
            setEditingBook('NEW');
            setBookFormData({
                id: nextId,
                title: '',
                author: '',
                year: '115年',
                price: '300',
                isbn: '',
                stock: '10',
                category: '文史哲學集成',
                isNew: true,
                isLast: false,
                cover: '',
                intro: '',
                心得: ''
            });
        }
    };

    // 圖片檔案轉換為 Base64
    const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            alert("圖片檔案過大，建議上傳 2MB 以下的圖片以保證網頁載入速度！");
            return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            setBookFormData(prev => ({ ...prev, cover: ev.target.result }));
            showToast('圖片已成功轉換並載入預覽', 'success');
        };
        reader.readAsDataURL(file);
    };

    // 儲存書籍
    const handleSaveBook = (e) => {
        e.preventDefault();
        if (!bookFormData.id.trim() || !bookFormData.title.trim()) {
            alert("書碼與書名為必填欄位！");
            return;
        }

        const newBookObj = {
            id: String(bookFormData.id).trim(),
            title: String(bookFormData.title).trim(),
            author: String(bookFormData.author).trim(),
            year: String(bookFormData.year).trim(),
            price: Number(bookFormData.price) || 0,
            isbn: String(bookFormData.isbn).trim(),
            stock: String(bookFormData.stock).trim() || '10',
            category: String(bookFormData.category).trim() || '未分類',
            isNew: Boolean(bookFormData.isNew),
            isLast: Boolean(bookFormData.isLast),
            cover: bookFormData.cover.trim(),
            intro: bookFormData.intro.trim(),
            心得: bookFormData.心得.trim()
        };

        if (editingBook === 'NEW') {
            // 檢查書碼是否重複
            const exists = books.some(b => String(b.id) === newBookObj.id);
            if (exists) {
                alert(`書碼 ${newBookObj.id} 已經存在，請更換其他書碼！`);
                return;
            }
            setBooks(prev => [newBookObj, ...prev]);
            showToast(`新書《${newBookObj.title}》已成功新增！`, 'success');
        } else {
            // 編輯更新
            setBooks(prev => prev.map(b => String(b.id) === String(editingBook.id) ? newBookObj : b));
            showToast(`書籍《${newBookObj.title}》資料已更新！`, 'success');
        }

        setEditingBook(null);
    };

    // 刪除書籍
    const handleDeleteBook = (book) => {
        if (window.confirm(`確定要刪除書籍【${book.id}】《${book.title}》嗎？此動作無法復原！`)) {
            setBooks(prev => prev.filter(b => String(b.id) !== String(book.id)));
            showToast(`書籍《${book.title}》已刪除`, 'danger');
        }
    };

    // 導出 data.js 檔案
    const handleExportDataJs = () => {
        const fullData = {
            settings: settings,
            ui: staticData.ui || {},
            carousels: carousels,
            choices: staticData.choices || [],
            books: books
        };

        const fileContent = "window.STATIC_DATA = " + JSON.stringify(fullData, null, 2) + ";";
        const blob = new Blob([fileContent], { type: 'application/javascript;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('已生成並下載最新 data.js！直接覆蓋專案目錄並推送到 GitHub 即可更新網站。', 'success');
    };

    // 更新訂單狀態
    const handleUpdateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.orderId === orderId ? { ...o, status: newStatus } : o));
        if (viewingOrder && viewingOrder.orderId === orderId) {
            setViewingOrder(prev => ({ ...prev, status: newStatus }));
        }
        showToast(`訂單 ${orderId} 狀態已更新為【${newStatus}】`, 'success');
    };

    // 刪除訂單
    const handleDeleteOrder = (orderId) => {
        if (window.confirm(`確定要刪除訂單 ${orderId} 嗎？`)) {
            setOrders(prev => prev.filter(o => o.orderId !== orderId));
            setViewingOrder(null);
            showToast(`訂單 ${orderId} 已刪除`, 'danger');
        }
    };

    // 更新客服處理狀態
    const handleUpdateCsStatus = (msgId, newStatus) => {
        setCsMessages(prev => prev.map(m => m.id === msgId ? { ...m, status: newStatus } : m));
        if (viewingCs && viewingCs.id === msgId) {
            setViewingCs(prev => ({ ...prev, status: newStatus }));
        }
        showToast(`客服反映 ${msgId} 狀態已更新為【${newStatus}】`, 'success');
    };

    // 刪除客服紀錄
    const handleDeleteCs = (msgId) => {
        if (window.confirm(`確定要刪除此客服留言嗎？`)) {
            setCsMessages(prev => prev.filter(m => m.id !== msgId));
            setViewingCs(null);
            showToast(`客服留言已刪除`, 'danger');
        }
    };

    // 儲存密碼設定
    const handleSaveNewPassword = (e) => {
        e.preventDefault();
        const newPwd = e.target.newPwd.value.trim();
        if (newPwd.length < 6) {
            alert('密碼長度不得少於 6 位數！');
            return;
        }
        setSavedPassword(newPwd);
        localStorage.setItem('lapen_admin_pwd', newPwd);
        e.target.reset();
        showToast('管理員密碼已成功更新！', 'success');
    };

    // 儲存 GAS URL 設定
    const handleSaveGasUrl = (e) => {
        e.preventDefault();
        const url = e.target.gasUrl.value.trim();
        setGasUrl(url);
        localStorage.setItem('lapen_gas_url', url);
        showToast('Google Apps Script API 網址已儲存！', 'success');
    };

    // 若未登入，顯示登入畫面
    if (!isLoggedIn) {
        return (
            <div className="min-h-screen flex items-center justify-center bg-[#241D17] px-4">
                <div className="max-w-md w-full bg-[#FAF8F5] rounded-2xl shadow-2xl p-8 border border-[#8C5A2B]/30">
                    <div className="text-center mb-8">
                        <div className="w-16 h-16 bg-[#8C5A2B] text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <h2 className="text-2xl font-bold font-serif text-[#241D17]">文史哲出版社</h2>
                        <p className="text-sm text-[#8C5A2B] mt-1 tracking-wider">網站後台管理系統</p>
                    </div>

                    <form onSubmit={handleLogin} className="space-y-5">
                        <div>
                            <label className="block text-xs font-bold text-[#4A3B32] uppercase mb-2">管理員存取密碼</label>
                            <input
                                type="password"
                                value={passwordInput}
                                onChange={(e) => setPasswordInput(e.target.value)}
                                placeholder="請輸入管理密碼 (預設: lapen_admin_888)"
                                className="w-full px-4 py-3 rounded-xl border border-[#D4C5B9] focus:outline-none focus:ring-2 focus:ring-[#8C5A2B] bg-white text-sm"
                                required
                            />
                        </div>

                        {loginError && (
                            <div className="p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200">
                                {loginError}
                            </div>
                        )}

                        <button
                            type="submit"
                            className="w-full py-3.5 bg-[#8C5A2B] hover:bg-[#6B421E] text-white font-bold rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2"
                        >
                            <span>驗證並進入後台</span>
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                            </svg>
                        </button>
                    </form>

                    <div className="mt-8 pt-6 border-t border-[#E8DCCE] text-center">
                        <a href="index.html" className="text-xs text-[#8C5A2B] hover:underline flex items-center justify-center gap-1">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                            </svg>
                            <span>返回出版社官方網站首頁</span>
                        </a>
                    </div>
                </div>
            </div>
        );
    }

    // 主後台畫面
    return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#F4EFEA]">
            {/* 訊息通知 Toast */}
            {syncMessage && (
                <div className={`fixed top-5 right-5 z-50 px-5 py-3.5 rounded-xl shadow-xl text-sm font-bold flex items-center gap-3 transition-all duration-300 ${
                    syncMessage.type === 'success' ? 'bg-emerald-800 text-white' :
                    syncMessage.type === 'danger' ? 'bg-rose-800 text-white' : 'bg-[#241D17] text-white'
                }`}>
                    <span>{syncMessage.msg}</span>
                </div>
            )}

            {/* 側邊導航欄 */}
            <aside className="w-full md:w-64 bg-[#241D17] text-[#FAF8F5] flex flex-col shrink-0 shadow-2xl">
                <div className="p-6 border-b border-[#3D3126]">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-[#8C5A2B] flex items-center justify-center text-white font-serif font-bold text-xl shadow">
                            文
                        </div>
                        <div>
                            <h1 className="font-bold font-serif text-lg leading-tight">文史哲出版社</h1>
                            <p className="text-xs text-[#BFAF9E]">後台管理系統</p>
                        </div>
                    </div>
                </div>

                <nav className="p-4 space-y-1.5 flex-1">
                    <button
                        onClick={() => setActiveTab('dashboard')}
                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${
                            activeTab === 'dashboard' ? 'bg-[#8C5A2B] text-white shadow-md' : 'text-[#D4C5B9] hover:bg-[#32271F]'
                        }`}
                    >
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                        </svg>
                        <span>總覽儀表板</span>
                    </button>

                    <button
                        onClick={() => setActiveTab('books')}

            {viewingOrder && (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-[#FAF8F5] w-full max-w-xl rounded-2xl shadow-2xl border border-[#8C5A2B]/40 overflow-hidden">
                        <div className="bg-[#241D17] text-white px-6 py-4 flex items-center justify-between">
                            <h3 className="font-serif font-bold text-lg">訂單明細 #{viewingOrder.orderId}</h3>
                            <button onClick={() => setViewingOrder(null)} className="text-gray-400 hover:text-white text-xl font-bold">✕</button>
                        </div>
                        <div className="p-6 space-y-4 text-sm">
                            <div className="grid grid-cols-2 gap-3 bg-white p-4 rounded-xl border border-[#E8DCCE]">
                                <div><strong>收件人：</strong> {viewingOrder.name}</div>
                                <div><strong>聯絡電話：</strong> {viewingOrder.phone}</div>
                                <div><strong>電子信箱：</strong> {viewingOrder.email || '無'}</div>
                                <div><strong>下單時間：</strong> {viewingOrder.date}</div>
                                <div className="col-span-2"><strong>寄送地址：</strong> {viewingOrder.address || '自取 / 門市'}</div>
                                <div className="col-span-2"><strong>付款方式：</strong> {viewingOrder.payment}</div>
                                {viewingOrder.memo && <div className="col-span-2 text-amber-900 bg-amber-50 p-2 rounded"><strong>備註：</strong> {viewingOrder.memo}</div>}
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-[#E8DCCE]">
                                <h4 className="font-bold text-xs text-[#8C5A2B] uppercase mb-2">訂購商品清單</h4>
                                <p className="font-mono text-xs whitespace-pre-line text-gray-800">{viewingOrder.items}</p>
                                <div className="mt-3 pt-3 border-t border-gray-200 text-right text-base font-bold text-[#8C5A2B]">
                                    總金額：NT$ {viewingOrder.total}
                                </div>
                            </div>

                            <div className="flex items-center justify-between pt-2">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold text-gray-600">變更狀態：</span>
                                    {['待處理', '處理中', '已出貨', '已完成', '已取消'].map(st => (
                                        <button
                                            key={st}
                                            onClick={() => handleUpdateOrderStatus(viewingOrder.orderId, st)}
                                            className={`text-xs px-2.5 py-1 rounded-lg font-bold ${
                                                viewingOrder.status === st ? 'bg-[#8C5A2B] text-white' : 'bg-gray-200 hover:bg-gray-300 text-gray-700'
                                            }`}
                                        >
                                            {st}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            )}

        </div>
    );
}

ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
</script>
</body>
</html>
