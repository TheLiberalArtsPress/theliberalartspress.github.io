            cartMemoPlaceholder: '若有特殊收件需求或匯款資訊請填寫於此...',

            cartCheckingOutBtn: '訂單處理中...',

            cartOptionTransfer: '銀行轉帳（運費另計）',
            cartTotalLabel: '總計金額',
            cartBookCountLabel: '共 {count} 本書',
            
            msgLoadingInventory: '完整庫存同步中...',
            msgLoadedInventory: '最新庫存已載入',
            msgLoadingMoreBooks: '正在從雲端載入更多書目...',
            msgOutOfStock: '已售罄',
            msgNoBooksFound: '此分類目前沒有相關書籍喔！',
            msgSearchingBooks: '雲端書庫正在尋找符合此分類的書籍...',
            
            urlAboutPresident: '', // 原生重構精美彈窗呈現
            urlContactUs: '' // 原生重構箋紙捎書信封呈現
        };

        function App() {
            const [ui, setUi] = useState(defaultUI);
            const [settings, setSettings] = useState({
                systemName: '文史哲出版社',
                systemSubName: 'The Liberal Arts Press'
            });

            const [carousels, setCarousels] = useState(() => {
                const cached = localStorage.getItem('lapen_carousels_v4');
                if (cached) { try { const p = JSON.parse(cached); if(p.length > 0) return p; } catch(e) {} }
                return fallbackCarousels;
            });
            const [carouselIndex, setCarouselIndex] = useState(0); 
            
            const [books, setBooks] = useState(() => {
                const cached = localStorage.getItem('lapen_books_v4');
                if (cached) { try { const p = JSON.parse(cached); if(p.length > 0) return p.sort(() => 0.5 - Math.random()); } catch(e) {} }
                return fallbackBooks;
            });

            const [choiceBooks, setChoiceBooks] = useState([]);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isContactOpen, setIsContactOpen] = useState(false);
            const [notification, setNotification] = useState(null);
            
            const [isCartDetailsOpen, setIsCartDetailsOpen] = useState(true);
            const [selectedPayment, setSelectedPayment] = useState('店取付現金');

            const [isBooksLoading, setIsBooksLoading] = useState(true); 
            const [isCheckingOut, setIsCheckingOut] = useState(false);
            const [isSubmittingCS, setIsSubmittingCS] = useState(false);

            const [lastActionTime, setLastActionTime] = useState(0);

            const [selectedCategory, setSelectedCategory] = useState('全部');
            const [visibleCount, setVisibleCount] = useState(8); 
            
            const [isAboutOpen, setIsAboutOpen] = useState(false);
            const [isPresidentOpen, setIsPresidentOpen] = useState(false); // 原生大師大儒師承彈窗

            const [isSearchModalOpen, setIsSearchModalOpen] = useState(false);
            const [isRandomBooksOpen, setIsRandomBooksOpen] = useState(false);

            const [searchForm, setSearchForm] = useState({ code: '', title: '', author: '', year: '', category: '' });
            const [appliedSearch, setAppliedSearch] = useState({ code: '', title: '', author: '', year: '', category: '' });
            const [searchVisibleCount, setSearchVisibleCount] = useState(8);

            const [randomBooks, setRandomBooks] = useState([]);
            
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [showBackToTop, setShowBackToTop] = useState(false);
            const [isAllCategoriesExpanded, setIsAllCategoriesExpanded] = useState(false);

            // 📸 截圖明細受理頁面狀態
            const [submittedDetail, setSubmittedDetail] = useState(null); 
            
            // 🔍 試算表訂單明細查詢系統狀態
            const [isOrderQueryOpen, setIsOrderQueryOpen] = useState(false);
            const [orderQueryInput, setOrderQueryInput] = useState('');
            const [queryResults, setQueryResults] = useState([]);
            const [isQueryingGAS, setIsQueryingGAS] = useState(false);
            const [hasQueried, setHasQueried] = useState(false);
            
            const sliderRef = useRef(null);

            const showMsg = (text) => {
                setNotification(text);
                setTimeout(() => setNotification(null), 3000);
            };

            const checkRateLimit = () => {
                const now = Date.now();
                if (now - lastActionTime < 15000) {
                    const secondsLeft = Math.ceil((15000 - (now - lastActionTime)) / 1000);
                    showMsg(`操作過於頻繁，請等待 ${secondsLeft} 秒後再試！`);
                    return false;
                }
                return true;
            };

            const syncWithGAS = async (action, payloadData = null) => {
                try {
                    const currentOrigin = window.location.origin;
                    const safeOrigin = currentOrigin.includes("usercontent.goog") 
                        ? "https://candylovema.github.io" 
                        : currentOrigin;

                    const payloadObj = { 
                        action: action, 
                        payload: payloadData,
                        origin: safeOrigin
                    };
                    
                    const response = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payloadObj)
                    });
                    
                    const data = await response.json();
                    
                    if (data.status === 'error') {
                        console.error("後端拒絕請求:", data.msg);
                        if(currentOrigin.includes("localhost") || currentOrigin.includes("usercontent.goog")) {
                             showMsg("API 執行失敗: " + data.msg);
                        }
                    }
                    
                    return data;
                } catch (e) {
                    console.error("GAS Sync Error:", e);
                    return { status: 'error', msg: e.toString() };
                }
            };

            useEffect(() => {
                syncWithGAS('FETCH_SETTINGS').then(resSettings => {
                    if (resSettings && resSettings.data) {
                        setSettings(prev => ({...prev, ...resSettings.data}));
                        if (resSettings.data.systemName) document.title = `${resSettings.data.systemName} 有限公司｜台灣人文學術出版社・文學歷史哲學專業出版（首頁）官網`;
                    }
                }).catch(() => {});

                syncWithGAS('FETCH_UI').then(resUi => {
                    if (resUi && resUi.data) {
                        setUi(prev => ({...prev, ...resUi.data}));
                        if (resUi.data.frontendName) {
                            document.title = `${resUi.data.frontendName} - 首頁`;
                        }
                    }
                }).catch(() => {});

                syncWithGAS('FETCH_CAROUSELS').then(resCarousels => {
                    if (resCarousels && Array.isArray(resCarousels.data)) {
                        const published = resCarousels.data.filter(c => c.status === '已發佈');
                        if (published.length > 0) {
                            setCarousels(published);
                            localStorage.setItem('lapen_carousels_v4', JSON.stringify(published));
                        }
                    }
                }).catch(() => {});

                syncWithGAS('FETCH_CHOICES').then(resChoices => {
                    if (resChoices && Array.isArray(resChoices.data)) {
                        const validChoices = resChoices.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                        setChoiceBooks(validChoices);
                    }
                }).catch(() => {});

                syncWithGAS('FETCH_BOOKS').then(resBooks => {
                    if (resBooks && Array.isArray(resBooks.data)) {
                        const validBooks = resBooks.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                        const shuffledBooks = validBooks.sort(() => 0.5 - Math.random());
                        setBooks(shuffledBooks);
                        try { localStorage.setItem('lapen_books_v4', JSON.stringify(shuffledBooks.slice(0, 150))); } catch (e) {}
                    }
                }).finally(() => {
                    setIsBooksLoading(false);
                });
            }, []);

            const handleOrderQuerySubmit = async (e) => {
                e.preventDefault();
                const term = orderQueryInput.trim().toLowerCase();
                if (term.length < 2) {
                    showMsg("查詢關鍵字長度至少需要 2 個字以上。");
                    return;
                }
                setIsQueryingGAS(true);
                setHasQueried(true);
                setQueryResults([]);
                try {
                    // 🛡️ 高安全防禦升級：將查詢鍵發送由後端進行隱私去識別化過濾，不下載全表
                    const res = await syncWithGAS('FETCH_ORDERS', { query: term });
                    if (res && res.status === 'success' && Array.isArray(res.data)) {
                        // 後端已在伺服器端將個資打上星號，前端直接安全加載
                        setQueryResults(res.data);
                    } else {
                        showMsg(res.msg || "未能取得訂單記錄，請確認網路或稍後再試。");
                    }
                } catch (error) {
                    console.error("Order search error:", error);
                    showMsg("查詢出錯，請稍候重試");
                } finally {
                    setIsQueryingGAS(false);
                }
            };

            useEffect(() => {
                if (carousels.length <= 1) return;
                const timer = setInterval(() => setCarouselIndex((prev) => (prev + 1) % carousels.length), 5000); 
                return () => clearInterval(timer);
            }, [carousels.length]);

            useEffect(() => {
                if (isBooksLoading || displayChoiceBooks.length <= 1) return;

                const autoPlayTimer = setInterval(() => {
                    if (sliderRef.current) {
                        const { scrollLeft, scrollWidth, clientWidth } = sliderRef.current;
                        if (scrollLeft + clientWidth >= scrollWidth - 5) {
                            sliderRef.current.scrollTo({ left: 0, behavior: 'smooth' });
                        } else {
                            sliderRef.current.scrollTo({ left: scrollLeft + 300, behavior: 'smooth' });
                        }
                    }
                }, 4000);

                return () => clearInterval(autoPlayTimer);
            }, [books, displayChoiceBooks, isBooksLoading]);

            const dynamicCategories = useMemo(() => {
                const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
                const combined = ['全部', '文史哲學集成', ...cats.filter(c => c !== '文史哲學集成' && c !== '全部')];
                return [...new Set(combined)];
            }, [books]);

            const visibleCategories = useMemo(() => {
                return isAllCategoriesExpanded ? dynamicCategories : dynamicCategories.slice(0, 5);
            }, [dynamicCategories, isAllCategoriesExpanded]);

            const excelCategories = useMemo(() => {
                const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
                return [...new Set(cats)].sort();
            }, [books]);

            const filteredBooks = useMemo(() => {
                if (selectedCategory === '全部') return books;
                return books.filter(b => b.category === selectedCategory);
            }, [books, selectedCategory]);

            const visibleBooks = filteredBooks.slice(0, visibleCount);
            const displayChoiceBooks = choiceBooks.length > 0 ? choiceBooks : books.slice(0, 10);

            const openRandomBooksModal = () => {
                setIsMobileMenuOpen(false);
                if (books.length > 0) {
                    const shuffled = [...books].sort(() => 0.5 - Math.random());
                    setRandomBooks(shuffled.slice(0, 8));
                }
                setIsRandomBooksOpen(true);
            };

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                setAppliedSearch(searchForm);
                setSearchVisibleCount(8);
            };

            const indexSearchBooks = useMemo(() => {
                return books.filter(b => {
                    const matchCode = !appliedSearch.code || (b.id && b.id.toString().includes(appliedSearch.code));
                    const matchTitle = !appliedSearch.title || (b.title && b.title.includes(appliedSearch.title));
                    const matchAuthor = !appliedSearch.author || (b.author && b.author.includes(appliedSearch.author));
                    const matchPage = !appliedSearch.year || (b.year && b.year.toString().includes(appliedSearch.year));
                    const matchCat = !appliedSearch.category || appliedSearch.category === '全部' || b.category === appliedSearch.category;
                    return matchCode && matchTitle && matchAuthor && matchPage && matchCat;
                });
            }, [books, appliedSearch]);

            const visibleSearchBooks = indexSearchBooks.slice(0, searchVisibleCount);

            const addToCart = (book) => {
                if (book.stock <= 0) return showMsg("抱歉，目前缺貨中！");
                setCart(prev => {
                    const existing = prev.find(i => i.id === book.id);
                    if (existing) {
                        return prev.map(i => i.id === book.id ? {...i, qty: i.qty + 1} : i);
                    }
                    return [...prev, {...book, qty: 1}];
                });
                showMsg(`已加入書包: ${book.title}`);
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(i => i.id !== id));
            };
            
            const updateCartQty = (id, delta) => {
                setCart(prev => {
                    return prev.map(i => {
                        if (i.id === id) {
                            const newQty = i.qty + delta;
                            if (newQty < 1) {
                                return null; 
                            }
                            if (newQty > i.stock) {
                                showMsg("已達該書目前庫存上限！");
                                return i;
                            }
                            return { ...i, qty: newQty };
                        }
                        return i;
                    }).filter(Boolean); 
                });
            };

            const cartTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

            const sanitizeInput = (val) => {
                if (val === undefined || val === null) return "";
                let str = String(val).trim();
                if (/^[=\+\-\@]/.test(str)) {
                    return "'" + str; 
                }
                return str;
            };

            const handleCheckout = async (e) => {
                e.preventDefault();
                if (isCheckingOut) return;
                
                if (!checkRateLimit()) return;

                const formData = new FormData(e.target);
                const info = Object.fromEntries(formData);

                const name = sanitizeInput(info.name);
                const phone = sanitizeInput(info.phone);
                const email = sanitizeInput(info.email);
                const address = sanitizeInput(info.address);
                const memo = sanitizeInput(info.memo);

                if (name.length < 2) return showMsg("請輸入正確的收件人姓名");
                if (!/^\+?[0-9\-\s]{8,15}$/.test(info.phone.replace(/[^0-9\+]/g, ''))) {
                    return showMsg("請輸入有效的聯絡電話");
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(info.email)) {
                    return showMsg("請輸入正確的電子信箱格式");
                }
                if (address.length < 6) return showMsg("請輸入正確的詳細寄送地址");

                setIsCheckingOut(true);
                setLastActionTime(Date.now()); 
                showMsg("訂單處理中，請稍候，請勿關閉視窗...");
                
                const now = new Date();
                const pad = (n) => n.toString().padStart(2, '0');
                const formattedDate = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                
                const rawItems = cart.map(i => ({ title: i.title, qty: i.qty, price: i.price }));
                const itemsStr = cart.map(i => `${sanitizeInput(i.title)} (數量: ${i.qty})`).join('\n');
                
                const dateStr = `${now.getFullYear().toString().slice(-2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
                const randStr = Math.floor(1000 + Math.random() * 9000); 
                const orderId = `ORD-${dateStr}-${randStr}`;

                const newOrder = {
                    id: orderId, customer: name, phone: phone, email: email, address: address, payment: info.payment,
                    items: itemsStr, total: cartTotal, status: '處理中', date: formattedDate, memo: memo,
                    '訂單編號': orderId, '客戶姓名': name, '電話': phone, '電子信箱': email, 'Email': email,
                    '地址': address, '付款方式': info.payment, '購買項目': itemsStr, '總金額': cartTotal, '狀態': '處理中', '日期': formattedDate
                };
                
                const res = await syncWithGAS('CREATE_ORDER', newOrder);
                
                setIsCheckingOut(true);
                if (res && res.status === 'success') {
                    setBooks(books.map(b => {
                        const ci = cart.find(c => c.id === b.id);
                        return ci ? { ...b, stock: b.stock - ci.qty } : b;
                    }));
                    
                    // 📸 成功寫入客觀截圖明細狀態，展示無碼憑證以便客人當場紀錄
                    setSubmittedDetail({
                        type: 'order',
                        data: {
                            id: orderId,
                            customer: name,
                            phone: phone,
                            email: email,
                            address: address,
                            payment: info.payment,
                            memo: memo,
                            date: formattedDate,
                            total: cartTotal,
                            items: rawItems
                        }
                    });

                    setCart([]); 
                    setIsCartOpen(false);
                    showMsg(`訂單已成功送出！`);
                } else {
                    const errorMsg = res ? res.msg : '伺服器無回應';
                    showMsg(`訂單送出失敗：${errorMsg}`);
                    console.error("結帳失敗原因：", errorMsg);
                }
                setIsCheckingOut(false);
            };

            const handleCSSubmit = async (e) => {
                e.preventDefault();
                if (isSubmittingCS) return;
                
                if (!checkRateLimit()) return;

                const name = sanitizeInput(e.target.name.value);
                const phone = sanitizeInput(e.target.phone.value);
                const email = sanitizeInput(e.target.email.value);
                const msg = sanitizeInput(e.target.message.value);

                if (name.length < 2) return showMsg("請輸入您的稱呼");
                if (!/^\+?[0-9\-\s]{8,15}$/.test(phone.replace(/[^0-9\+]/g, ''))) {
                    return showMsg("請輸入有效的聯絡電話");
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    return showMsg("請輸入正確的電子信箱格式");
                }
                if (msg.length < 5) return showMsg("反應內容請至少輸入5個字");

                setIsSubmittingCS(true);
                setLastActionTime(Date.now()); 
                showMsg("信函遞送中，請稍候...");
                
                const combinedQuery = `【聯絡電話】${phone}\n【Email信箱】${email}\n─────────────────\n【反映內容】\n${msg}`;
                const submitId = `CS-${Date.now().toString().slice(-6)}`;

                const newLog = { id: submitId, platform: 'Web官網', user: name, query: combinedQuery };
                const res = await syncWithGAS('NEW_CS_MSG', newLog);
                
                setIsSubmittingCS(false);
                if (res && res.status === 'success') {
                    // 📸 寫入留言截圖明細狀態，展示憑證
                    setSubmittedDetail({
                        type: 'cs',
                        data: {
                            id: submitId,
                            name: name,
                            phone: phone,
                            email: email,
                            message: msg,
                            date: new Date().toLocaleString()
                        }
                    });

                    setIsContactOpen(false);
                    showMsg("感謝您的來信，編輯部將儘快答覆！");
                } else {
                    const errorMsg = res ? res.msg : '伺服器無回應';
                    showMsg(`發送失敗：${errorMsg}`);
                }
            };

            const scrollSlider = (direction) => {
                if (sliderRef.current) {
                    const { scrollLeft, clientWidth } = sliderRef.current;
                    const scrollTo = direction === 'left' ? scrollLeft - clientWidth * 0.8 : scrollLeft + clientWidth * 0.8;
                    sliderRef.current.scrollTo({ left: scrollTo, behavior: 'smooth' });
                }
            };

            const renderListFromLines = (text, defaultLines) => {
                const lines = text ? text.split('\n').filter(l => l.trim() !== '') : defaultLines;
                return lines.map((line, idx) => <li key={idx} className="hover:text-[var(--primary-color)] transition-colors">{line}</li>);
            };

            const rootStyle = {
                '--primary-color': ui.themeColor,
                '--dark-color': ui.darkThemeColor,
                '--bg-color': ui.lightBgColor,
                '--bg-light': ui.bgLightColor,
                '--text-dark': ui.textDarkColor,
                '--border-color': ui.borderColor,
                '--accent-color': ui.accentColor,
                '--footer-bg': ui.footerBgColor,
                '--body-font': ui.bodyFont || 'Noto Sans TC',
                '--title-font': ui.titleFont || 'Noto Serif TC',
            };

            return (
                <div style={rootStyle} className="selection:bg-[var(--primary-color)] selection:text-white min-h-screen bg-[var(--bg-color)] font-serif transition-all duration-300 relative pb-10 scroll-smooth flex flex-col">
                    
                    {}
                    <nav className="p-4 md:px-8 border-b border-[var(--border-color)] flex justify-between items-center bg-white/95 backdrop-blur-md sticky top-0 z-40 shadow-sm relative">
                        <div className="flex items-center space-x-2 md:space-x-4 cursor-pointer select-none" onClick={() => {
                            if (window.innerWidth < 1024) setIsMobileMenuOpen(!isMobileMenuOpen);
                            else window.scrollTo(0,0);
                        }}>
                            {ui.frontendLogoUrl ? (
                                <img src={formatImageUrl(ui.frontendLogoUrl)} className="w-8 h-8 md:w-10 md:h-10 object-contain" alt="Logo" onError={(e)=>{e.target.style.display='none'}} />
                            ) : (
                                <ModernLogo className="w-8 h-8 md:w-10 md:h-10" />
                            )}
                            <div className="flex flex-col">
                                <div className="flex items-center gap-1">
                                    <h1 className="text-lg md:text-[22px] font-black text-[var(--dark-color)] tracking-[0.1em] font-sans">{ui.frontendName || settings.systemName}</h1>

                                                            href="https://www.facebook.com/people/%E6%96%87%E5%8F%B2%E5%93%B2%E5%87%BA%E7%89%88%E7%A4%BE/61590146114229/?locale=zh_TW" 
                                                            target="_blank" 
                                                            rel="noopener noreferrer"
                                                            className="inline-flex items-center font-bold text-blue-600 hover:text-blue-800 hover:underline"
                                                        >
                                                            📘 詳情請私訊臉書專頁詢問 ↗
                                                        </a>
                                                    </p>
                                                    
                                                    <p className="flex items-center text-gray-700">
                                                        <span className="w-12 shrink-0">戶名：</span>
                                                        <a 
                                                            href="https://www.facebook.com/people/%E6%96%87%E5%8F%B2%E5%93%B2%E5%87%BA%E7%89%88%E7%A4%BE/61590146114229/?locale=zh_TW" 
                                                            target="_blank" 
                                                            rel="noopener noreferrer"
                                                            className="inline-flex items-center font-bold text-blue-600 hover:text-blue-800 hover:underline"
                                                        >
                                                            📘 詳情請私訊臉書專頁詢問 ↗
                                                        </a>
                                                    </p>
                                                    <p className="mt-2 text-gray-500 border-t border-amber-200/60 pt-2">※ 轉帳完成後，請於下方「寄件備註」填寫您的「轉帳後五碼」或「劃撥單姓名」，以利快速對帳出貨。</p>
                                                </div>
                                            )}
                                            {selectedPayment === '店取付現金' && (
                                                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 text-xs text-[var(--text-dark)] leading-relaxed text-left animate-in">
                                                    <p className="font-bold text-emerald-800 mb-1 flex items-center gap-1">🏪 門市取貨地點：</p>
                                                    <p>台北市中正區羅斯福路一段72巷4號（文史哲門市）</p>
                                                    <p className="text-gray-500 mt-1.5">※ 書籍備妥後，客服專員將致電與您確認前來取書時間，屆時現場現金付款取書即可。</p>
                                                </div>
                                            )}

                                            <div className="text-left">
                                                <label className="block text-xs font-bold text-gray-500 mb-1">{ui.cartLabelMemo}</label>
                                                <textarea name="memo" placeholder={ui.cartMemoPlaceholder} className="w-full border-2 border-[var(--border-color)] p-3 rounded-xl focus:border-[var(--primary-color)] bg-[var(--bg-light)] text-sm outline-none h-16 resize-none"></textarea>
                                            </div>
                                            
                                            <button type="submit" disabled={isCheckingOut} className={`w-full bg-[var(--dark-color)] text-white py-4 rounded-xl font-bold mt-auto shadow-lg transition-colors flex justify-center items-center gap-2 text-lg mb-12 md:mb-0 ${isCheckingOut ? 'opacity-50 cursor-not-allowed' : 'hover:bg-[var(--primary-color)] active:scale-[0.98]'}`}>
                                                {isCheckingOut ? <Clock className="animate-spin" size={22} /> : <CheckCircle size={22} />}
                                                {isCheckingOut ? ui.cartCheckingOutBtn : ui.cartBtnCheckout}
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {}
                    {/* 🌸 Modals: 7. 📸 交易結帳/客訴受理憑證與截圖單據 (高安全性，僅展示當下的個人填寫完整明細) */}
                    {submittedDetail && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[250] flex justify-center items-center p-4 md:p-8 overflow-y-auto animate-in">
                            <div className="bg-[var(--bg-color)] w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col overflow-hidden border-4 border-double border-[var(--primary-color)] relative" onClick={(e)=>e.stopPropagation()}>
                                
                                <div className="bg-[var(--dark-color)] text-[var(--bg-light)] p-5 flex justify-between items-center border-b-4 border-[var(--primary-color)]">
                                    <span className="font-sans font-bold flex items-center gap-2 text-lg tracking-wider">
                                        <CheckCircle className="text-emerald-500 animate-pulse" size={24} /> 
                                        {submittedDetail.type === 'order' ? '交易處理成功・受理憑證' : '系統反映成功・受理明細'}
                                    </span>
                                    <button type="button" onClick={() => setSubmittedDetail(null)} className="bg-white/10 hover:bg-white/20 p-2 rounded-full text-white transition-colors"><X size={18} /></button>
                                </div>

                                <div className="p-6 md:p-10 bg-white receipt-container flex-1 relative overflow-hidden border-b-4 border-dashed border-gray-200">
                                    <div className="absolute right-6 top-16 w-32 h-32 rounded-full border-4 border-emerald-600/10 flex items-center justify-center text-emerald-600/10 font-bold tracking-widest text-center select-none pointer-events-none transform rotate-12 font-sans text-sm">
                                        文史哲出版社<br/>核訖章
                                    </div>

                                    <div className="text-center border-b-2 border-dashed border-[var(--border-color)] pb-6 mb-6">
                                        <h3 className="text-2xl font-black tracking-widest text-[var(--dark-color)] mb-2 font-serif">文史哲出版社有限公司</h3>
                                        <p className="text-xs tracking-widest text-[var(--primary-color)] uppercase font-sans font-bold mb-4">{settings.systemSubName}</p>
                                        <div className="mx-auto w-48 h-8 bg-gray-100 border-x-4 border-gray-300 flex items-center justify-between px-2 overflow-hidden select-none mb-2" style={{backgroundImage: 'repeating-linear-gradient(90deg, #222, #222 2px, transparent 2px, transparent 6px)'}}></div>
                                        <span className="font-mono text-sm tracking-widest text-gray-500 font-bold select-all">{submittedDetail.data.id}</span>
                                    </div>

                                    {submittedDetail.type === 'order' ? (
                                        <div className="font-sans text-left space-y-4 text-gray-700">
                                            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center mb-6">
                                                <p className="text-emerald-800 font-bold text-base flex items-center justify-center gap-1.5 mb-1">📸 請立即將此畫面截圖保存！</p>
                                                <p className="text-xs text-emerald-700">本憑證可作為日後郵政劃撥對帳、匯款核對與取貨之正式依據。</p>
                                            </div>

                                            <div className="grid grid-cols-2 gap-y-2 border-b border-gray-100 pb-4 text-sm">
                                                <div><span className="text-gray-400">訂單編號：</span><strong className="text-gray-800 font-mono select-all">{submittedDetail.data.id}</strong></div>
                                                <div><span className="text-gray-400">受理日期：</span><strong className="text-gray-800">{submittedDetail.data.date}</strong></div>
                                                <div><span className="text-gray-400">訂購客戶：</span><strong className="text-gray-800">{submittedDetail.data.customer}</strong></div>
                                                <div><span className="text-gray-400">聯絡電話：</span><strong className="text-gray-800">{submittedDetail.data.phone}</strong></div>
                                                <div className="col-span-2"><span className="text-gray-400">電子信箱：</span><strong className="text-gray-800">{submittedDetail.data.email}</strong></div>
                                                <div className="col-span-2"><span className="text-gray-400">寄送地址：</span><strong className="text-gray-800">{submittedDetail.data.address}</strong></div>
                                                <div className="col-span-2"><span className="text-gray-400">付款方式：</span><strong className="text-[var(--primary-color)] font-bold">{submittedDetail.data.payment}</strong></div>
                                                {submittedDetail.data.memo && (
                                                    <div className="col-span-2"><span className="text-gray-400">寄件備註：</span><span className="text-gray-600 italic bg-gray-50 px-2 py-1 rounded inline-block text-xs">{submittedDetail.data.memo}</span></div>
                                                )}
                                            </div>

                                            <div className="py-2">
                                                <p className="font-bold text-[var(--dark-color)] mb-3 border-b border-dashed border-[var(--border-color)] pb-1 flex items-center gap-1.5"><BookOpen size={16}/> 購買圖書明細：</p>
                                                <div className="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                                                    {submittedDetail.data.items.map((it, idx) => (
                                                        <div key={idx} className="flex justify-between items-start text-xs leading-relaxed text-gray-700">
                                                            <span className="font-bold pr-4 flex-1 line-clamp-1">{it.title}</span>
                                                            <span className="text-gray-500 whitespace-nowrap">數量: {it.qty}</span>
                                                            <span className="font-bold text-gray-900 w-20 text-right whitespace-nowrap">NT$ {it.price * it.qty}</span>
                                                        </div>
                                                    ))}
                                                    <div className="border-t border-dashed border-gray-300 pt-3 mt-3 flex justify-between items-baseline">
                                                        <span className="font-bold text-gray-800 text-sm">付款總額 (含稅/NT$)</span>
                                                        <span className="text-2xl font-black text-[var(--primary-color)] font-sans">NT$ {submittedDetail.data.total.toLocaleString()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {submittedDetail.data.payment === '銀行轉帳（運費另計）' && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 text-xs text-amber-900">
                                                    <p className="font-bold mb-1">🏦 轉帳劃撥指南：</p>
                                                    <p>請劃撥至郵政：<strong className="text-amber-800">05128812</strong>，戶名：<strong className="text-amber-800">彭正雄</strong>。</p>
                                                    <p className="mt-1 text-gray-500">轉帳完成後，您可直接至官方臉書粉專，或撥打 02-2351-1028 提供匯款末五碼對帳出貨。</p>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="font-sans text-left space-y-4 text-gray-700">
                                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center mb-6">
                                                <p className="text-blue-800 font-bold text-base flex items-center justify-center gap-1.5 mb-1">📸 請立即截圖此反映單據！</p>
                                                <p className="text-xs text-blue-700">請妥善留存受理序號，以便與編輯部核對後續工作進度。</p>
                                            </div>

                                            <div className="grid grid-cols-2 gap-y-2 border-b border-gray-100 pb-4 text-sm">
                                                <div><span className="text-gray-400">受理序號：</span><strong className="text-gray-800 font-mono select-all">{submittedDetail.data.id}</strong></div>
                                                <div><span className="text-gray-400">送出日期：</span><strong className="text-gray-800">{submittedDetail.data.date}</strong></div>
                                                <div><span className="text-gray-400">反映人：</span><strong className="text-gray-800">{submittedDetail.data.name}</strong></div>
                                                <div><span className="text-gray-400">聯絡電話：</span><strong className="text-gray-800">{submittedDetail.data.phone}</strong></div>
                                                <div className="col-span-2"><span className="text-gray-400">聯絡信箱：</span><strong className="text-gray-800">{submittedDetail.data.email}</strong></div>
                                            </div>

                                            <div className="py-2">
                                                <p className="font-bold text-[var(--dark-color)] mb-3 border-b border-dashed border-[var(--border-color)] pb-1 flex items-center gap-1.5"><MessageCircle size={16}/> 信箋反映詳情：</p>
                                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 text-sm text-gray-600 italic whitespace-pre-wrap leading-relaxed">
                                                    {submittedDetail.data.message}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="receipt-edge-zigzag h-[10px] w-full bg-white relative -top-0.5 pointer-events-none shrink-0"></div>

                                <div className="bg-gray-100 p-4 flex flex-col sm:flex-row gap-3 justify-center">
                                    <button type="button" onClick={() => window.print()} className="bg-white border border-[var(--accent-color)] hover:bg-gray-50 text-[var(--text-dark)] py-2.5 px-6 rounded-xl font-bold flex justify-center items-center gap-2 text-sm shadow-sm transition-all"><Printer size={16}/> 列印 / 另存 PDF</button>
                                    <button type="button" onClick={() => setSubmittedDetail(null)} className="bg-[var(--dark-color)] hover:bg-[var(--primary-color)] text-white py-2.5 px-8 rounded-xl font-bold flex justify-center items-center gap-2 text-sm shadow-md transition-all active:scale-[0.98]"><Check size={16}/> 關閉明細，繼續瀏覽</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* 🌸 Modals: 8. 🔍 試算表訂單明細查詢系統 (含去識別化脫敏，防止惡意窮舉姓名或手機號碼) */}
                    {isOrderQueryOpen && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[200] flex justify-center items-center p-4 md:p-8 overflow-y-auto animate-in" onClick={() => { setIsOrderQueryOpen(false); setOrderQueryInput(''); setQueryResults([]); setHasQueried(false); }}>
                            <div className="bg-[var(--bg-light)] w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-[var(--border-color)]" onClick={(e)=>e.stopPropagation()}>
                                
                                <div className="p-5 border-b border-[var(--border-color)] flex justify-between items-center bg-white">
                                    <h2 className="text-xl md:text-2xl font-black flex items-center gap-3 text-[var(--dark-color)] font-serif tracking-widest"><FileText className="text-[var(--primary-color)]" size={28} /> 最近訂單查詢</h2>
                                    <button type="button" onClick={() => { setIsOrderQueryOpen(false); setOrderQueryInput(''); setQueryResults([]); setHasQueried(false); }} className="bg-[var(--bg-light)] border border-[var(--accent-color)] hover:bg-[#E6D5C3] px-4 py-2 rounded-full text-sm font-bold text-[var(--text-dark)] transition flex items-center gap-1.5 shadow-sm"><X size={16} /> 關閉查詢</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6 md:p-10 font-sans bg-white flex flex-col">
                                    <div className="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-4 text-sm mb-8 leading-relaxed text-justify flex items-start gap-2.5">
                                        <Info className="text-[var(--primary-color)] mt-0.5 shrink-0" size={18} />
                                        <span>
                                            <strong>隱私與安全提示：</strong>為保護讀者隱私，查詢僅對照比對由您輸入的<strong>客戶姓名、手機號碼或訂單編號</strong>。此外，本系統實施了高度去識別化處理，絕不直接顯示他人完整之姓名、手機號碼、送件備註等敏感數據，保障讀者通訊安全。
                                        </span>
                                    </div>

                                    <form onSubmit={handleOrderQuerySubmit} className="flex gap-3 mb-8">
                                        <input 
                                            type="text" 
                                            value={orderQueryInput} 
                                            onChange={(e) => setOrderQueryInput(e.target.value)}
                                            placeholder="請輸入：姓名、手機號碼 或 ORD- 開頭之單號" 
                                            required
                                            className="flex-1 border-2 border-[var(--border-color)] p-3 rounded-xl focus:border-[var(--primary-color)] bg-[var(--bg-light)] text-sm outline-none font-bold"
                                        />
                                        <button type="submit" disabled={isQueryingGAS} className="bg-[var(--dark-color)] text-white px-8 py-3 rounded-xl font-bold hover:bg-[var(--primary-color)] transition-all flex items-center gap-2 shadow-md shrink-0 active:scale-95 disabled:opacity-50 text-sm">
                                            {isQueryingGAS ? <RefreshCw className="animate-spin" size={16}/> : <Search size={16}/>}
                                            {isQueryingGAS ? '正在檢索...' : '立即檢索'}
                                        </button>
                                    </form>

                                    <div className="flex-1 min-h-[150px] relative">
                                        {isQueryingGAS ? (
                                            <div className="absolute inset-0 flex flex-col justify-center items-center gap-3 text-[var(--primary-color)]">
                                                <RefreshCw className="animate-spin" size={36}/>
                                                <span className="font-bold text-sm">正在即時連線至 Google Sheets 試算表 `orders`，請稍候...</span>
                                            </div>
                                        ) : hasQueried ? (
                                            queryResults.length === 0 ? (
                                                <div className="py-12 text-center text-gray-400 font-bold flex flex-col items-center justify-center gap-3">
                                                    <Info size={32} />
                                                    <span>抱歉，找不到與「{orderQueryInput}」相符的訂單記錄。<br/>請確認您輸入的資訊（姓名、電話或訂單編號）是否正確。</span>
                                                </div>
                                            ) : (
                                                <div className="space-y-6">
                                                    <h4 className="text-gray-500 font-bold text-sm border-b pb-2 text-left">檢索比對成功 ─ 共找到 {queryResults.length} 筆符合條件之訂單：</h4>
                                                    <div className="space-y-4">
                                                        {queryResults.map((ord, idx) => {
                                                            const orderNum = ord.id || ord['訂單編號'] || '-';
                                                            // 🛡️ 後端已經進行安全去識別化，直接渲染，不再二次脫敏引起長度錯亂
                                                            const orderCust = ord.customer || ord['客戶姓名'] || '-';
                                                            const orderPhone = ord.phone || ord['電話'] || '-';
                                                            const orderDate = ord.date || ord['日期'] || '-';
                                                            const orderTotal = ord.total || ord['總金額'] || 0;
                                                            const orderStatus = ord.status || ord['狀態'] || '處理中';
                                                            const orderPayment = ord.payment || ord['付款方式'] || '-';
                                                            const orderItems = ord.items || ord['購買項目'] || '-';
                                                            const orderMemo = "🔒 基於隱私安全已自動屏蔽";

                                                            return (
                                                                <div key={idx} className="bg-[var(--bg-light)]/40 p-5 rounded-2xl border border-[var(--border-color)] hover:border-[var(--primary-color)] transition-all flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm group">
                                                                    <div className="space-y-2 flex-1 text-left w-full">
                                                                        <div className="flex flex-wrap items-center gap-2">
                                                                            <span className="bg-[var(--dark-color)] text-[var(--bg-light)] font-mono text-xs font-bold px-2.5 py-1 rounded-md">{orderNum}</span>
                                                                            <span className={`text-xs font-bold px-2.5 py-1 rounded-md ${
                                                                                orderStatus === '處理中' ? 'bg-amber-100 text-amber-800' : 
                                                                                orderStatus === '已出貨' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'
                                                                            }`}>{orderStatus}</span>
                                                                        </div>
                                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1 text-xs text-gray-500 leading-relaxed pt-1">
                                                                            <div>訂購客戶：<strong className="text-gray-800">{orderCust}</strong></div>
                                                                            <div>聯絡電話：<strong className="text-gray-800">{orderPhone}</strong></div>
                                                                            <div>付款方式：<strong className="text-gray-800">{orderPayment}</strong></div>
                                                                            <div>下單時間：<strong className="text-gray-800">{orderDate}</strong></div>
                                                                            <div className="col-span-1 sm:col-span-2 pt-2 border-t border-gray-100 mt-1">
                                                                                <span className="text-gray-400 font-bold block mb-1">訂購圖書明細：</span>
                                                                                <pre className="whitespace-pre-wrap font-sans text-xs bg-white border border-gray-200/60 p-2.5 rounded-lg text-gray-700 italic leading-loose select-text">{orderItems}</pre>
                                                                            </div>
                                                                            <div className="col-span-1 sm:col-span-2 pt-1">
                                                                                備註說明：<span className="text-gray-500 bg-amber-50/60 px-2 py-0.5 rounded text-xs font-semibold">{orderMemo}</span>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                    <div className="text-right whitespace-nowrap self-end md:self-center border-t md:border-t-0 border-dashed border-[var(--border-color)] pt-3 md:pt-0 w-full md:w-auto flex md:flex-col justify-between md:justify-center items-baseline md:items-end">
                                                                        <span className="text-xs text-gray-400 font-bold">訂單總金額</span>
                                                                        <strong className="text-2xl font-black text-[var(--primary-color)] mt-0.5">NT$ {parseInt(orderTotal).toLocaleString()}</strong>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )
                                        ) : (
                                            <div className="absolute inset-0 flex flex-col justify-center items-center gap-2 text-gray-400 font-bold">
                                                <Search size={32}/>
                                                <span className="text-sm">請於上方輸入搜尋條件，點擊「立即檢索」查詢。</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {notification && (
                        <div className="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 bg-[var(--dark-color)] text-white px-6 py-4 rounded-xl shadow-2xl animate-in font-bold text-[15px] z-[300] flex items-center gap-3 border-l-4 border-[var(--primary-color)] whitespace-nowrap">
                            <CheckCircle size={20} className="text-[var(--accent-color)]" /> {notification}
                        </div>
                    )}
                </div> 
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
