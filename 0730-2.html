        const maskName = (name) => {
            if (!name || name === '-') return '-';
            const str = String(name).trim();
            if (str.length <= 1) return str;
            if (str.length === 2) return str[0] + "○";
            if (str.length === 3) return str[0] + "○" + str[2];
            let masked = "";
            for (let i = 0; i < str.length; i++) {
                if (i === 0 || i === 2) masked += str[i];
                else masked += "○";
            }
            return masked;
        };

        const maskPhone = (phone) => {
            if (!phone || phone === '-') return '-';
            const str = String(phone).replace(/^'/, "").trim();
            if (str.length <= 6) return "****";
            return str.substring(0, 3) + "*".repeat(str.length - 6) + str.substring(str.length - 3);
        };

        const maskAddress = (address) => {
            if (!address || address === '-') return '-';
            const str = String(address).trim();
            if (str.length <= 6) return str;
            return str.substring(0, 6) + "＊".repeat(Math.min(8, str.length - 6));

        };

        const getBookIntro = (book) => {
            if (!book) return '';
            for (const key of Object.keys(book)) {
                const k = key.trim().toLowerCase();
                if (k.includes('intro') || k.includes('list') || k.includes('description') || k.includes('簡介') || k.includes('介紹') || k === 'n' || k === '13') {
                    const val = String(book[key] || '').trim();
                    if (val) return val;

            return String(book.intro || book['intro'] || book.list || book['list'] || book.description || book['書籍介紹'] || '').trim();

        const getBookReview = (book) => {
            if (!book) return '';
            for (const key of Object.keys(book)) {
                const k = key.trim().toLowerCase();
                if (k.includes('心得') || k.includes('review') || k.includes('thought') || k.includes('評析') || k.includes('notes') || k.includes('comment') || k === 'o' || k === '14') {

            if (book.title) {
                for (const [titleKey, reviewText] of Object.entries(BUILTIN_REVIEWS)) {
                    if (book.title.includes(titleKey)) return reviewText;
                }
            }
            return '';

                try {
                    const currentOrigin = window.location.origin;
                    const safeOrigin = currentOrigin.includes("usercontent.goog") 
                        ? "https://candylovema.github.io" 
                        : currentOrigin;

                    const payloadObj = { action, payload: payloadData, origin: safeOrigin };
                    const response = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payloadObj)
                    });
                    
                    const data = await response.json();
                    if (data.status === 'error' && (currentOrigin.includes("localhost") || currentOrigin.includes("usercontent.goog"))) {
                        showMsg("API 執行失敗: " + data.msg);
                    }
                    return data;
                } catch (e) {
                    return { status: 'error', msg: e.toString() };
                }

                Promise.allSettled([

                    syncWithGAS('FETCH_UI'),
                    syncWithGAS('FETCH_CAROUSELS'),
                    syncWithGAS('FETCH_CHOICES'),
                    syncWithGAS('FETCH_BOOKS')
                ]).then(([settingsRes, uiRes, carouselsRes, choicesRes, booksRes]) => {
                    if (settingsRes.status === 'fulfilled' && settingsRes.value?.data) {
                        const data = settingsRes.value.data;
                        setSettings(prev => ({ ...prev, ...data }));
                        if (data.systemName) document.title = `${data.systemName} 有限公司｜台灣人文學術出版社（首頁）官網`;
                    }
                    if (uiRes.status === 'fulfilled' && uiRes.value?.data) {
                        const data = uiRes.value.data;
                        setUi(prev => ({ ...prev, ...data }));
                        if (data.frontendName) document.title = `${data.frontendName} - 首頁`;
                    }
                    if (carouselsRes.status === 'fulfilled' && Array.isArray(carouselsRes.value?.data)) {
                        const published = carouselsRes.value.data.filter(c => c.status === '已發佈');
                        if (published.length > 0) {
                            setCarousels(published);
                            safeSetStorage('lapen_carousels_v4', JSON.stringify(published));
                        }
                    }
                    if (choicesRes.status === 'fulfilled' && Array.isArray(choicesRes.value?.data)) {
                        const valid = choicesRes.value.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                        setChoiceBooks(valid);
                    }
                    if (booksRes.status === 'fulfilled' && Array.isArray(booksRes.value?.data)) {
                        const valid = booksRes.value.data.filter(b => b.title && b.title.trim() !== '' && b.title !== '未命名書籍');
                        const shuffled = valid.sort(() => 0.5 - Math.random());
                        setBooks(shuffled);
                        safeSetStorage('lapen_books_v6', JSON.stringify(shuffled.slice(0, 150)));
                    }
                }).finally(() => setIsBooksLoading(false));
            }, []);

            const handleOrderQuerySubmit = async (e) => {
                e.preventDefault();
                const term = orderQueryInput.trim().toLowerCase();
                if (term.length < 2) return showMsg("請輸入至少 2 個字以供精確比對");
                
                setIsQueryingGAS(true);
                setHasQueried(true);
                setQueryResults([]);
                try {
                    const res = await syncWithGAS('FETCH_ORDERS');
                    if (res && res.status === 'success' && Array.isArray(res.data)) {
                        const filtered = res.data.filter(ord => {
                            const oId = String(ord.id || ord['訂單編號'] || '').toLowerCase();
                            const oCust = String(ord.customer || ord['客戶姓名'] || '').toLowerCase();
                            const oPhone = String(ord.phone || ord['電話'] || '').toLowerCase();
                            return oId.includes(term) || oCust.includes(term) || oPhone.includes(term);
                        });
                        setQueryResults(filtered);
                    } else showMsg(res.msg || "未能取得訂單記錄");
                } catch (error) {
                    showMsg("查詢出錯，請稍候重試");
                } finally {
                    setIsQueryingGAS(false);
                }
            };

            useEffect(() => {
                if (carousels.length <= 1) return;
                const timer = setInterval(() => setCarouselIndex((prev) => (prev + 1) % carousels.length), 5000); 
                return () => clearInterval(timer);
            }, [carousels.length]);

            const dynamicCategories = useMemo(() => {
                const priorityCats = [
                    '文史哲學集成',
                    '文史哲學術叢刊',
                    '文學叢刊',
                    '文史哲詩叢'
                ];

                const existingCats = [...new Set(books.map(b => b.category).filter(c => c && c.trim() !== ""))];
                const presentPriority = priorityCats.filter(cat => existingCats.includes(cat));
                const remainingPriority = priorityCats.filter(cat => !existingCats.includes(cat));
                const orderedPriority = [...presentPriority, ...remainingPriority];

                const otherCats = existingCats.filter(c => !priorityCats.includes(c) && c !== '全部');

                return ['全部', ...orderedPriority, ...otherCats];
            }, [books]);

            const visibleCategories = useMemo(() => {
                if (isAllCategoriesExpanded) return dynamicCategories;
                return dynamicCategories.slice(0, 5);
            }, [dynamicCategories, isAllCategoriesExpanded]);

            const excelCategories = useMemo(() => {
                const cats = books.map(b => b.category).filter(c => c && c.trim() !== "");
                return [...new Set(cats)].sort();
            }, [books]);

            const filteredBooks = useMemo(() => {
                if (selectedCategory === '全部') return books;
                return books.filter(b => b.category === selectedCategory);
            }, [books, selectedCategory]);

            const visibleBooks = filteredBooks.slice(0, visibleCount);
            const displayChoiceBooks = choiceBooks.length > 0 ? choiceBooks : books.slice(0, 10);

            const analyzeBookWithGemini = async (targetBook, customQ = "") => {
                if (!targetBook) return;
                setIsAiAnalyzing(true);
                setAiAnalysisResult("");
                
                try {
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const systemPrompt = `你是一位享譽華文出版界的權威國學專家與「文史哲出版社」資深學術總編輯。你的任務是針對華文書籍進行極具深度、嚴謹、精闢且優美的學術解析與導讀。請以典雅流暢的繁體中文回答。`;

                    let userPrompt = `請為以下書籍進行深度學術解析與閱讀導引：\n`;
                    userPrompt += `■ 書名：${targetBook.title}\n`;
                    userPrompt += `■ 作者：${targetBook.author || '未標明'}\n`;
                    userPrompt += `■ 出版年份：${targetBook.year || '未標明'}\n`;
                    userPrompt += `■ 叢書類別：${targetBook.category || '通用'}\n`;
                    userPrompt += `■ 書籍編號：${targetBook.id || '無'}\n`;
                    
                    const bookIntroText = getBookIntro(targetBook);
                    if (bookIntroText) {
                        userPrompt += `■ 既有書籍介紹與綱要：${bookIntroText}\n`;
                    }

                    const bookReviewThought = getBookReview(targetBook);
                    if (bookReviewThought) {
                        userPrompt += `■ 編輯部特色心得評析：${bookReviewThought}\n`;
                    }

                    if (customQ.trim()) {
                        userPrompt += `\n【讀者特別提問】：${customQ.trim()}\n請針對上述問題進行深入解答。`;
                    } else {
                        userPrompt += `\n請包含以下四大解讀維度：\n`;
                        userPrompt += `1. 📜【時代背景與學術脈絡】（分析本書在該領域的歷史定位與學術價值）\n`;
                        userPrompt += `2. 💡【三大核心旨趣與研讀亮點】（列出最值得細細品味的3個重點）\n`;
                        userPrompt += `3. 🎯【適合閱讀對象與深度思考題】（提供給研究者或一般讀者的進階思考方向）\n`;
                        userPrompt += `4. ✒️【主編精闢一句話導讀】（用一句深具文化底蘊的話總結本書靈魂）`;
                    }

                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                        setAiAnalysisResult(generatedText);
                    } else {
                        setAiAnalysisResult("⚠️ 無法取得 AI 分析結果，請稍後重試。");

                    return matchCode && matchTitle && matchAuthor && matchPage && matchCat;

            }, [books, appliedSearch]);

            const visibleSearchBooks = indexSearchBooks.slice(0, searchVisibleCount);

            const addToCart = (book) => {
                if (book.stock <= 0) return showMsg("抱歉，目前缺貨中！");

                    const existing = prev.find(i => i.id === book.id);

                    return [...prev, {...book, qty: 1}];
                });
                showMsg(`已加入書包: ${book.title}`);
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            
            const updateCartQty = (id, delta) => {
                setCart(prev => prev.map(i => {
                    if (i.id === id) {
                        const newQty = i.qty + delta;
                        if (newQty < 1) return null;
                        if (newQty > i.stock) { showMsg("已達庫存上限！"); return i; }
                        return { ...i, qty: newQty };
                    }
                    return i;
                }).filter(Boolean));
            };

            const cartTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

            const sanitizeInput = (val) => {
                if (val === undefined || val === null) return "";
                let str = String(val).trim();
                if (/^[=\+\-\@]/.test(str)) return "'" + str; 
                return str;
            };

            const handleCheckout = async (e) => {
                e.preventDefault();
                if (isCheckingOut || !checkRateLimit()) return;

                const formData = new FormData(e.target);
                const info = Object.fromEntries(formData);

                const name = sanitizeInput(info.name);
                const phone = sanitizeInput(info.phone);
                const email = sanitizeInput(info.email);
                const address = sanitizeInput(info.address);
                const memo = sanitizeInput(info.memo);

                if (name.length < 2) return showMsg("請輸入正確的收件人姓名");
                if (!/^\+?[0-9\-\s]{8,15}$/.test(info.phone.replace(/[^0-9\+]/g, ''))) return showMsg("請輸入有效的聯絡電話");
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(info.email)) return showMsg("請輸入正確的電子信箱格式");
                if (address.length < 6) return showMsg("請輸入正確的詳細寄送地址");

                setIsCheckingOut(true);
                setLastActionTime(Date.now()); 
                showMsg("訂單處理中，請稍候...");
                
                const now = new Date();
                const pad = (n) => n.toString().padStart(2, '0');
                const formattedDate = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                
                const rawItems = cart.map(i => ({ title: i.title, qty: i.qty, price: i.price }));
                const itemsStr = cart.map(i => `${sanitizeInput(i.title)} (數量: ${i.qty})`).join('\n');
                
                const dateStr = `${now.getFullYear().toString().slice(-2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
                const randStr = Math.floor(1000 + Math.random() * 9000); 
                const orderId = `ORD-${dateStr}-${randStr}`;

                const newOrder = {
                    id: orderId, customer: name, phone: phone, email: email, address: address, payment: info.payment,
                    items: itemsStr, total: cartTotal, status: '處理中', date: formattedDate, memo: memo,
                    '訂單編號': orderId, '客戶姓名': name, '電話': phone, '電子信箱': email, 'Email': email,
                    '地址': address, '付款方式': info.payment, '購買項目': itemsStr, '總金額': cartTotal, '狀態': '處理中', '日期': formattedDate
                };
                
                const res = await syncWithGAS('CREATE_ORDER', newOrder);
                
                if (res && res.status === 'success') {
                    setBooks(books.map(b => {
                        const ci = cart.find(c => c.id === b.id);
                        return ci ? { ...b, stock: b.stock - ci.qty } : b;
                    }));
                    
                    setSubmittedDetail({
                        type: 'order',
                        data: {
                            id: orderId, customer: name, phone, email, address, payment: info.payment, memo, date: formattedDate, total: cartTotal, items: rawItems
                        }
                    });

                    setCart([]); 
                    setIsCartOpen(false);
                    showMsg(`訂單已成功送出！`);
                } else {
                    showMsg(`訂單送出失敗：${res ? res.msg : '伺服器無回應'}`);
                }
                setIsCheckingOut(false);
            };

            const handleCSSubmit = async (e) => {
                e.preventDefault();
                if (isSubmittingCS || !checkRateLimit()) return;

                const name = sanitizeInput(e.target.name.value);
                const phone = sanitizeInput(e.target.phone.value);
                const email = sanitizeInput(e.target.email.value);
                const msg = sanitizeInput(e.target.message.value);

                if (name.length < 2) return showMsg("請輸入您的稱呼");
                if (!/^\+?[0-9\-\s]{8,15}$/.test(phone.replace(/[^0-9\+]/g, ''))) return showMsg("請輸入有效的聯絡電話");
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg("請輸入正確的電子信箱格式");
                if (msg.length < 5) return showMsg("反映內容請至少輸入5個字");

                setIsSubmittingCS(true);
                setLastActionTime(Date.now()); 
                showMsg("訊息傳送中...");
                
                const combinedQuery = `【聯絡電話】${phone}\n【Email信箱】${email}\n─────────────────\n【反映內容】\n${msg}`;
                const submitId = `CS-${Date.now().toString().slice(-6)}`;

                const newLog = { id: submitId, platform: 'Web官網', user: name, query: combinedQuery };
                const res = await syncWithGAS('NEW_CS_MSG', newLog);
                
                setIsSubmittingCS(false);
                if (res && res.status === 'success') {
                    setSubmittedDetail({
                        type: 'cs',
                        data: { id: submitId, name, phone, email, message: msg, date: new Date().toLocaleString() }
                    });
                    setIsContactOpen(false);
                    showMsg("感謝您的反映，客服專員將盡快回覆！");
                } else {
                    showMsg(`發送失敗：${res ? res.msg : '伺服器無回應'}`);
                }
            };

                                                name="contact" 
                                                placeholder="聯絡電話或 Email (選填，方便對帳與聯繫)" 
                                                className="w-full border border-sky-300 bg-white p-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 font-medium text-gray-800"
                                            />
                                        </div>

                                        <textarea 
                                            name="content" 
                                            required 
                                            rows="4" 
                                            placeholder={`請輸入您對《${reviewBook.title}》的研讀心得、修訂建議或觀點提問...`} 
                                            className="w-full border border-sky-300 bg-white p-3.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 font-medium text-gray-800 resize-none leading-relaxed"
                                        ></textarea>

                                        <button 
                                            type="submit" 
                                            disabled={isSubmittingReview} 
                                            className={`w-full bg-purple-400 hover:bg-purple-500 text-white py-3.5 rounded-xl font-bold shadow-md transition-all flex justify-center items-center gap-2 text-base ${isSubmittingReview ? 'opacity-50 cursor-not-allowed' : 'active:scale-[0.98]'}`}
                                        >
                                            {isSubmittingReview ? <Clock className="animate-spin" size={18} /> : <Send size={18} />}
                                            <span>{isSubmittingReview ? "正在傳送心得..." : "送出讀後心得反映"}</span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AI Analysis Modal */}
                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-lg z-[260] flex justify-center items-center p-4 md:p-8 overflow-y-auto animate-in" onClick={() => setIsAiModalOpen(false)}>
                            <div className="glass-modal w-full max-w-4xl max-h-[92vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border-2 border-indigo-300/50 bg-gradient-to-br from-slate-900/90 via-stone-900/95 to-slate-950/90 text-white" onClick={(e) => e.stopPropagation()}>
                                <div className="p-5 border-b border-indigo-500/30 flex justify-between items-center bg-indigo-950/40 backdrop-blur-md">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 rounded-xl bg-indigo-600/30 border border-indigo-400/40 text-amber-300">
                                            <Brain size={24} className="animate-pulse" />
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-black tracking-wide font-serif text-amber-100 flex items-center gap-2">
                                                <span>文史哲 AI 國學與學術分析儀</span>
                                                <span className="text-[10px] font-sans font-bold bg-indigo-500/30 border border-indigo-400/30 text-indigo-200 px-2 py-0.5 rounded-full">Gemini 3 Flash</span>
                                            </h2>
                                            <p className="text-xs text-indigo-200/80 font-sans">專屬學術研究導讀 ‧ 深度書籍內容評析引擎</p>
                                        </div>
                                    </div>
                                    <button type="button" onClick={() => setIsAiModalOpen(false)} className="hover:bg-white/10 p-2 rounded-full transition text-gray-300">
                                        <X size={20} />
                                    </button>
                                </div>

                                <div className="p-6 md:p-8 font-sans overflow-y-auto flex-1 space-y-6 text-slate-100">
                                    <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 md:p-5 space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                                            <label className="text-xs font-bold text-indigo-300 uppercase tracking-wider block">選擇欲分析之書籍：</label>
                                            <div className="md:col-span-2">
                                                <select 
                                                    value={aiSelectedBookId} 
                                                    onChange={(e) => {
                                                        const bId = e.target.value;
                                                        setAiSelectedBookId(bId);
                                                        const target = books.find(b => (b.id && b.id.toString() === bId) || b.title === bId);
                                                        if (target) analyzeBookWithGemini(target, aiCustomQuestion);
                                                    }}
                                                    className="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm font-bold text-amber-200 focus:outline-none focus:border-indigo-400"
                                                >
                                                    {books.map((b, idx) => (
                                                        <option key={idx} value={b.id || b.title}>
                                                            [{b.category || '未分類'}] {b.title} ({b.author || '無作者'})
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={aiCustomQuestion} 
                                                onChange={(e) => setAiCustomQuestion(e.target.value)} 
                                                placeholder="可輸入對本書的特別提問（例如：本書與宋代理學有何關聯？）" 
                                                className="flex-1 bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-400 font-medium"
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter') {
                                                        const target = books.find(b => (b.id && b.id.toString() === aiSelectedBookId) || b.title === aiSelectedBookId) || books[0];
                                                        analyzeBookWithGemini(target, aiCustomQuestion);
                                                    }
                                                }}
                                            />
                                            <button 
                                                type="button" 
                                                disabled={isAiAnalyzing}
                                                onClick={() => {
                                                    const target = books.find(b => (b.id && b.id.toString() === aiSelectedBookId) || b.title === aiSelectedBookId) || books[0];
                                                    analyzeBookWithGemini(target, aiCustomQuestion);
                                                }}
                                                className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 text-sm shrink-0 disabled:opacity-50"
                                            >
                                                {isAiAnalyzing ? <RefreshCw className="animate-spin" size={16} /> : <Sparkles size={16} />}
                                                <span>{isAiAnalyzing ? "分析中..." : "重新分析"}</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="relative min-h-[250px] bg-slate-900/90 border border-indigo-500/30 rounded-2xl p-6 md:p-8 font-serif leading-relaxed text-slate-200 text-base shadow-inner">
                                        {isAiAnalyzing ? (
                                            <div className="absolute inset-0 flex flex-col justify-center items-center gap-4 text-indigo-300">
                                                <Cpu className="animate-bounce text-amber-300" size={42} />
                                                <span className="font-bold text-sm font-sans animate-pulse">Gemini 3 Flash 正在精讀典籍並構建學術導讀...</span>
                                            </div>
                                        ) : aiAnalysisResult ? (
                                            <div className="whitespace-pre-wrap space-y-4">
                                                {aiAnalysisResult}
                                            </div>
                                        ) : (
                                            <div className="text-center py-16 text-slate-500 font-sans flex flex-col items-center gap-2">
                                                <HelpCircle size={32} />
                                                <span>請於上方選擇書籍，點擊「重新分析」啟動 AI 學術解讀。</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Notification Toast */}
                    {notification && (
                        <div className="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 glass-dark text-white px-6 py-4 rounded-xl shadow-2xl animate-in font-bold text-[15px] z-[300] flex items-center gap-3 border-l-4 border-[var(--primary-color)] whitespace-nowrap">
                            <CheckCircle size={20} className="text-[var(--accent-color)]" /> {notification}
                        </div>
                    )}
                </div> 
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
